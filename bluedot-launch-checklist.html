      });
    }
    block.appendChild(flags);

    wrap.appendChild(block);
  });

  return wrap;
}

function collectFlagsFor(cohort) {
  const out = [];
  Object.keys(cohort.weeks).sort((a, b) => Number(a) - Number(b)).forEach(wk => {
    const wd = cohort.weeks[wk];
    MIDROUND_SECTIONS.forEach(s => {
      s.items.forEach(item => {
        if (!item.triggersAction) return;
        if (item.triggersAction(wd.values)) {
          const action = wd.actions[item.id] || '';
          out.push({
            week: Number(wk),
            itemLabel: item.text,
            action: action,
            resolved: action.trim().length > 0
          });
        }
      });
    });
  });
  return out;
}

function trendBlock(title, fieldId, cohort, totalWeeks, yMin, yMax) {
  const wrap = document.createElement('div');
  wrap.className = 'trend-block';
  const h = document.createElement('h3');
  h.textContent = title;
  wrap.appendChild(h);
  const points = [];
  for (let w = 1; w <= totalWeeks; w++) {
    const wd = cohort.weeks[String(w)];
    if (wd && typeof wd.values[fieldId] === 'number') points.push({ x: w, y: wd.values[fieldId] });
  }
  if (points.length === 0) {
    const e = document.createElement('div');
    e.className = 'trend-empty';
    e.textContent = 'No data yet.';
    wrap.appendChild(e);
    return wrap;
  }
  const ys = points.map(p => p.y);
  const yLo = yMin != null ? yMin : Math.min(...ys);
  const yHi = yMax != null ? yMax : Math.max(...ys, yLo + 1);
  const W = 280;
  const H = 100;
  const padL = 24;
  const padR = 8;
  const padT = 10;
  const padB = 18;
  const xRange = totalWeeks - 1 || 1;
  const yRange = (yHi - yLo) || 1;
  const xAt = (x) => padL + ((x - 1) / xRange) * (W - padL - padR);
  const yAt = (y) => padT + (1 - (y - yLo) / yRange) * (H - padT - padB);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('class', 'trend-svg');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', title + ' trend');

  // Grid lines (3 horizontal)
  for (let i = 0; i <= 2; i++) {
    const y = padT + (i / 2) * (H - padT - padB);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', padL); line.setAttribute('x2', W - padR);
    line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('class', 'grid');
    svg.appendChild(line);
  }
  // Axis
  const axis = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  axis.setAttribute('x1', padL); axis.setAttribute('x2', padL);
  axis.setAttribute('y1', padT); axis.setAttribute('y2', H - padB);
  axis.setAttribute('class', 'axis');
  svg.appendChild(axis);
  // Y labels
  [yHi, (yHi + yLo) / 2, yLo].forEach((val, i) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', 4);
    t.setAttribute('y', padT + (i / 2) * (H - padT - padB) + 3);
    t.setAttribute('class', 'label');
    t.textContent = typeof val === 'number' ? (Math.round(val * 10) / 10) : val;
    svg.appendChild(t);
  });
  // X labels (every couple weeks)
  for (let w = 1; w <= totalWeeks; w++) {
    if (totalWeeks > 6 && w % 2 === 0) continue;
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', xAt(w) - 4);
    t.setAttribute('y', H - 4);
    t.setAttribute('class', 'label');
    t.textContent = 'W' + w;
    svg.appendChild(t);
  }
  // Line path
  const d = points.map((p, i) => (i === 0 ? 'M' : 'L') + xAt(p.x) + ' ' + yAt(p.y)).join(' ');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', d);
  path.setAttribute('class', 'line');
  svg.appendChild(path);
  // Dots
  points.forEach(p => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', xAt(p.x));
    c.setAttribute('cy', yAt(p.y));
    c.setAttribute('r', 3);
    c.setAttribute('class', 'dot');
    svg.appendChild(c);
  });
  wrap.appendChild(svg);
  return wrap;
}

// ----- Mid-round export -----

function exportMidroundMarkdown() {
  const round = activeMidroundRound();
  if (!round) return;
  const lines = [];
  lines.push('# Mid-Round Health Check');
  lines.push('');
  lines.push('- Round: ' + round.roundNumber);
  lines.push('- Course: ' + round.courseName);
  lines.push('- First session: ' + round.session1Date);
  lines.push('- Round length: ' + round.weeks + ' weeks');
  lines.push('- Exported: ' + new Date().toISOString().slice(0, 10));
  lines.push('');

  round.cohorts.forEach(cohort => {
    lines.push('## ' + cohort.label + (cohort.facilitator ? ' (' + cohort.facilitator + ')' : ''));
    lines.push('');
    const weekKeys = Object.keys(cohort.weeks).sort((a, b) => Number(a) - Number(b));
    if (weekKeys.length === 0) {
      lines.push('No weekly checks completed yet.');
      lines.push('');
      return;
    }
    weekKeys.forEach(wk => {
      const w = cohort.weeks[wk];
      lines.push('### Week ' + wk + (w.completedAt ? ' - completed ' + w.completedAt.slice(0, 10) : ' - in progress'));
      lines.push('');
      MIDROUND_SECTIONS.forEach((s, si) => {
        lines.push('#### ' + (si + 1) + '. ' + s.title);
        lines.push('');
        s.items.forEach(item => {
          const v = w.values[item.id];
          let display = '';
          if (item.type === 'check') display = v ? 'yes' : 'no';
          else if (item.type === 'choice') display = v || '(not selected)';
          else if (item.type === 'number') display = v == null ? '(empty)' : String(v);
          else display = v && v.trim() ? v : '(empty)';
          lines.push('- ' + item.text + ': ' + display);
          if (item.triggersAction && item.triggersAction(w.values)) {
            const a = w.actions[item.id] || '';
            lines.push('  - Action: ' + (a.trim() ? a : '(open)'));
          }
        });
        lines.push('');
      });
    });
  });

  lines.push('## Escalation guide');
  lines.push('');
  lines.push('| Signal | First action | If unresolved after 1 week | Escalate to |');
  lines.push('|---|---|---|---|');
  ESCALATION_TABLE.forEach(r => {
    lines.push('| ' + r.signal + ' | ' + r.first + ' | ' + r.if_unresolved + ' | ' + r.escalate + ' |');
  });

  const md = lines.join('\n');
  const courseSlug = (round.courseName || 'course').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const today = new Date().toISOString().slice(0, 10);
  const filename = courseSlug + '-round-' + round.roundNumber + '-midround-history-' + today + '.md';

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function dashboardFlags() {
  const out = [];
  const now = Date.now();

  getActiveLaunchRounds().forEach(round => {
    (round.issues || []).forEach(issue => {
      const cohortLabel = round.cohorts[issue.cohortIdx] ? round.cohorts[issue.cohortIdx].label : 'Unknown';
      const sectionTitle = SECTIONS[issue.sectionIdx] ? SECTIONS[issue.sectionIdx].title : 'General';
      const daysOpen = Math.max(0, Math.floor((now - new Date(issue.dateLogged).getTime()) / (1000 * 60 * 60 * 24)));
      out.push({
        kind: 'launch',
        roundKey: String(round.roundNumber),
        roundLabel: 'Round ' + round.roundNumber,
        cohortIdx: issue.cohortIdx,
        cohortLabel: cohortLabel,
        signalType: 'launch blocker',
        sectionTitle: sectionTitle,
        description: issue.description,
        daysOpen: daysOpen,
        weekRaised: null,
        issueId: issue.id,
        status: issue.status || 'open',
        owner: issue.owner || 'Course Ops Lead'
      });
    });
  });

  getActiveMidroundRounds().forEach(round => {
    // Launch-carryover issues that came across at conversion
    (round.issues || []).forEach(issue => {
      const cohortLabel = round.cohorts[issue.cohortIdx] ? round.cohorts[issue.cohortIdx].label : 'Unknown';
      const sectionTitle = SECTIONS[issue.sectionIdx] ? SECTIONS[issue.sectionIdx].title : 'General';
      const daysOpen = Math.max(0, Math.floor((now - new Date(issue.dateLogged).getTime()) / (1000 * 60 * 60 * 24)));
      out.push({
        kind: 'launch-carryover',
        roundKey: String(round.roundNumber),
        roundLabel: 'Round ' + round.roundNumber,
        cohortIdx: issue.cohortIdx,
        cohortLabel: cohortLabel,
        signalType: 'launch carryover',
        sectionTitle: sectionTitle,
        description: issue.description,
        daysOpen: daysOpen,
        weekRaised: null,
        issueId: issue.id,
        status: issue.status || 'open',
        owner: issue.owner || 'Course Ops Lead'
      });
    });
    round.cohorts.forEach((cohort, ci) => {
      Object.keys(cohort.weeks).forEach(wk => {
        const w = cohort.weeks[wk];
        if (!w.actionStatus) w.actionStatus = {};
        if (!w.actionOwner) w.actionOwner = {};
        const weekNum = Number(wk);
        MIDROUND_SECTIONS.forEach(s => {
          s.items.forEach(item => {
            if (!item.triggersAction) return;
            if (!item.triggersAction(w.values)) return;
            const actionText = (w.actions[item.id] || '').trim();
            let status = w.actionStatus[item.id];
            if (!status) status = actionText ? 'resolved' : 'open';
            const sessionStart = round.session1Date ? new Date(round.session1Date + 'T00:00:00').getTime() : now;
            const weekStart = sessionStart + (weekNum - 1) * 7 * 24 * 60 * 60 * 1000;
            const daysOpen = Math.max(0, Math.floor((now - weekStart) / (1000 * 60 * 60 * 24)));
            out.push({
              kind: 'midround',
              roundKey: String(round.roundNumber),
              roundLabel: 'Round ' + round.roundNumber,
              cohortIdx: ci,
              cohortLabel: cohort.label,
              signalType: flagSignalType(item.id),
              sectionTitle: s.title,
              description: item.text,
              daysOpen: daysOpen,
              weekRaised: weekNum,
              itemId: item.id,
              status: status,
              owner: w.actionOwner[item.id] || 'Course Ops Lead'
            });
          });
        });
      });
    });
  });
  return out;
}

function dashboardActiveCards() {
  const cards = [];
  const now = Date.now();
  getActiveLaunchRounds().forEach(round => {
    const totalChecked = round.cohorts.reduce((n, c) => n + Object.values(c.state.checks).filter(Boolean).length, 0);
    const total = round.cohorts.length * TOTAL_ITEMS;
    const pct = total ? Math.round((totalChecked / total) * 100) : 0;
    const openIssuesList = (round.issues || []).filter(i => i.status === 'open');
    const openIssues = openIssuesList.length;
    const blockedItems = openIssuesList.slice(0, 3).map(i => i.description);
    const session1 = round.session1Date ? new Date(round.session1Date + 'T00:00:00').getTime() : null;
    const days = session1 != null ? Math.round((session1 - now) / (1000 * 60 * 60 * 24)) : null;
    let urgency = 100;
    if (days != null) urgency = Math.max(0, days);
    let statusCls = 'status-grey', statusLabel = 'Not started';
    if (pct >= 90) { statusCls = 'status-green'; statusLabel = 'Ready'; }
    else if (pct >= 50) { statusCls = 'status-amber'; statusLabel = 'In progress'; }
    else if (pct > 0) { statusCls = 'status-red'; statusLabel = 'Behind'; }
    cards.push({
      kind: 'launch',
      roundKey: String(round.roundNumber),
      title: 'Round ' + round.roundNumber,
      course: round.courseName,
      modeLabel: 'launching',
      pct: pct,
      openIssues: openIssues,
      blockedItems: blockedItems,
      days: days,
      statusCls: statusCls,
      statusLabel: statusLabel,
      urgency: urgency
    });
  });
  getActiveMidroundRounds().forEach(round => {
    const current = currentWeekFor(round);
    const openActionList = allOpenActionsForRound(round);
    const openActions = openActionList.length;
    const blockedItems = openActionList.slice(0, 3).map(a => a.cohortLabel + ' / W' + a.week + ': ' + a.itemLabel);
    let worst = 'status-green';
    round.cohorts.forEach(c => {
      const s = cohortMidroundStatus(c, current);
      if (s.cls === 'status-red') worst = 'status-red';
      else if (s.cls === 'status-amber' && worst === 'status-green') worst = 'status-amber';
      else if (s.cls === 'status-grey' && worst === 'status-green') worst = 'status-grey';
    });
    const checksDoneThisWeek = round.cohorts.filter(c => c.weeks[String(current)] && c.weeks[String(current)].completedAt).length;
    // Distinguish complete / overdue / not started for the current week (per spec)
    let weekStatus = 'not started';
    if (checksDoneThisWeek === round.cohorts.length) weekStatus = 'complete';
    else {
      const todayDow = new Date().getDay();
      if (checksDoneThisWeek > 0) weekStatus = 'in progress';
      else if (todayDow >= 5 || todayDow === 0) weekStatus = 'overdue';
    }
    cards.push({
      kind: 'midround',
      roundKey: String(round.roundNumber),
      title: 'Round ' + round.roundNumber,
      course: round.courseName,
      modeLabel: 'mid-round',
      currentWeek: current,
      weeks: round.weeks,
      checksDone: checksDoneThisWeek,
      cohortCount: round.cohorts.length,
      checkStatus: weekStatus,
      openActions: openActions,
      blockedItems: blockedItems,
      statusCls: worst,
      statusLabel: worst === 'status-red' ? 'Needs action' : worst === 'status-amber' ? 'Watch' : worst === 'status-grey' ? 'Check pending' : 'Healthy'
    });
  });
  // P0-10: strict tiered sort. Tier 0 = all launches (by days asc).
  // Tier 1 = midround red. Tier 2 = midround amber. Tier 3 = midround grey/green.
  cards.sort((a, b) => {
    const tier = (c) => {
      if (c.kind === 'launch') return 0;
      if (c.statusCls === 'status-red') return 1;
      if (c.statusCls === 'status-amber') return 2;
      return 3;
    };
    const ta = tier(a), tb = tier(b);
    if (ta !== tb) return ta - tb;
    if (a.kind === 'launch' && b.kind === 'launch') return (a.days == null ? 999 : a.days) - (b.days == null ? 999 : b.days);
    return 0;
  });
  return cards;
}

function dashboardUpcomingThisWeek() {
  const items = [];
  const now = Date.now();
  const inSevenDays = now + 7 * 24 * 60 * 60 * 1000;
  getActiveLaunchRounds().forEach(round => {
    if (!round.session1Date) return;
    const session = new Date(round.session1Date + 'T00:00:00').getTime();
    if (session >= now && session <= inSevenDays) {
      const days = Math.round((session - now) / (1000 * 60 * 60 * 24));
      const totalChecked = round.cohorts.reduce((n, c) => n + Object.values(c.state.checks).filter(Boolean).length, 0);
      const total = round.cohorts.length * TOTAL_ITEMS;
      const pct = total ? Math.round((totalChecked / total) * 100) : 0;
      items.push({
        kind: 'launch',
        label: 'Round ' + round.roundNumber + ' launches in ' + days + ' day' + (days === 1 ? '' : 's'),
        meta: 'Launch checklist ' + pct + '% complete',
        roundKey: String(round.roundNumber)
      });
    }
  });
  getActiveMidroundRounds().forEach(round => {
    const current = currentWeekFor(round);
    const cohortsNeedingCheck = round.cohorts.filter(c => !c.weeks[String(current)] || !c.weeks[String(current)].completedAt).length;
    if (cohortsNeedingCheck > 0) {
      items.push({
        kind: 'midround',
        label: 'Round ' + round.roundNumber + ' week ' + current + ' check due',
        meta: cohortsNeedingCheck + ' of ' + round.cohorts.length + ' cohorts still to complete',
        roundKey: String(round.roundNumber)
      });
    }
    // Retrospective due: round ends within 7 days (per spec)
    if (round.session1Date) {
      const start = new Date(round.session1Date + 'T00:00:00').getTime();
      const end = start + (round.weeks || 5) * 7 * 24 * 60 * 60 * 1000;
      const daysToEnd = Math.round((end - now) / (1000 * 60 * 60 * 24));
      if (daysToEnd >= -7 && daysToEnd <= 7) {
        items.push({
          kind: 'retrospective',
          label: 'Round ' + round.roundNumber + ' retrospective due',
          meta: daysToEnd >= 0 ? 'Round ends in ' + daysToEnd + ' day' + (daysToEnd === 1 ? '' : 's') : 'Ended ' + Math.abs(daysToEnd) + ' days ago',
          roundKey: String(round.roundNumber)
        });
      }
    }
  });
  dashboardFlags().filter(f => f.daysOpen > 7 && f.status !== 'resolved').forEach(f => {
    items.push({
      kind: 'aging',
      label: f.roundLabel + ' / ' + f.cohortLabel + ' flag aging',
      meta: f.daysOpen + ' days open: ' + f.description.slice(0, 60),
      roundKey: f.roundKey,
      cohortIdx: f.cohortIdx,
      weekRaised: f.weekRaised
    });
  });
  return items;
}

function renderDashboardBanner() {
  const flags = dashboardFlags().filter(f => f.status !== 'resolved');
  const cards = dashboardActiveCards();
  const upcoming = dashboardUpcomingThisWeek();
  const launchesInWeek = upcoming.filter(u => u.kind === 'launch').length;
  let checksDue = 0, checksDone = 0;
  getActiveMidroundRounds().forEach(round => {
    const current = currentWeekFor(round);
    round.cohorts.forEach(c => {
      checksDue++;
      if (c.weeks[String(current)] && c.weeks[String(current)].completedAt) checksDone++;
    });
  });
  const today = new Date();
  const dayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][today.getDay()];
  const dateStr = today.toISOString().slice(0, 10);
  const banner = document.createElement('div');
  banner.className = 'dash-banner';
  const agedFlags = flags.filter(f => f.daysOpen > 7).length;
  const checksPct = checksDue > 0 ? Math.round((checksDone / checksDue) * 100) : 0;
  const launchesSub = launchesInWeek === 0
    ? 'none scheduled'
    : (launchesInWeek === 1 ? '1 round launching' : launchesInWeek + ' rounds launching');
  const checksSub = checksDue === 0
    ? 'none scheduled this week'
    : 'this week, ' + checksPct + '%';
  const flagsSub = flags.length === 0
    ? 'no open flags'
    : (agedFlags === 0 ? 'all under 7 days' : agedFlags + ' open over 7 days');
  const allHealthy = flags.length === 0
    && (checksDue === 0 || checksDone === checksDue)
    && launchesInWeek === 0
    && cards.every(c => c.statusCls === 'status-green');
  if (allHealthy && cards.length > 0) {
    banner.classList.add('healthy');
    banner.innerHTML = `
      <div class="cell"><div class="label">Today</div><div class="value">${escapeHtml(dayName)}</div><div class="sub">${escapeHtml(dateStr)}</div></div>
      <div class="cell healthy-message" style="grid-column: span 4;">
        <div class="label">Status</div>
        <div class="value">All systems healthy</div>
        <div class="sub">${cards.length} active ${cards.length === 1 ? 'round' : 'rounds'}, no open flags, all checks complete</div>
      </div>
    `;
    return banner;
  }
  banner.innerHTML = `
    <div class="cell"><div class="label">Today</div><div class="value">${escapeHtml(dayName)}</div><div class="sub">${escapeHtml(dateStr)}</div></div>
    <div class="cell"><div class="label">Active rounds</div><div class="value">${cards.length}</div><div class="sub">${getActiveLaunchRounds().length} launching, ${getActiveMidroundRounds().length} mid-round</div></div>
    <div class="cell${flags.length > 0 ? ' alert' : ''}"><div class="label">Action required</div><div class="value">${flags.length}</div><div class="sub">${flagsSub}</div></div>
    <div class="cell"><div class="label">Checks complete</div><div class="value">${checksDone}<span style="color:var(--text-muted);font-weight:400;"> of ${checksDue}</span></div><div class="sub">${checksSub}</div></div>
    <div class="cell"><div class="label">Launches in 7 days</div><div class="value">${launchesInWeek}</div><div class="sub">${launchesSub}</div></div>
  `;
  return banner;
}

function renderDashboardFlagsSection() {
  const sec = document.createElement('div');
  sec.className = 'dash-section';
  const heading = document.createElement('h2');
  heading.textContent = 'Action required';
  sec.appendChild(heading);

  const flags = dashboardFlags();

  if (flags.length === 0) {
    sec.appendChild(dashEmptyRow('No open action-required flags. Nothing on fire across active rounds.', 'healthy'));
    return sec;
  }

  const toolbar = document.createElement('div');
  toolbar.className = 'dash-flags-toolbar';
  toolbar.innerHTML = `
    <label class="toolbar-label" for="dash-flag-filter">Status</label>
    <select id="dash-flag-filter">
      <option value="active">Open and in progress</option>
      <option value="open">Open only</option>
      <option value="in-progress">In progress only</option>
      <option value="resolved">Resolved only</option>
      <option value="all">All</option>
    </select>
    <label class="toolbar-label" for="dash-flag-sort">Sort by</label>
    <select id="dash-flag-sort">
      <option value="days-open">Days open</option>
      <option value="week">Week raised</option>
      <option value="round">Round</option>
      <option value="signal">Signal type</option>
    </select>
  `;
  sec.appendChild(toolbar);

  const sortSel = toolbar.querySelector('#dash-flag-sort');
  const filterSel = toolbar.querySelector('#dash-flag-filter');
  const listWrap = document.createElement('div');
  sec.appendChild(listWrap);

  function paint() {
    const mode = sortSel.value;
    const filterMode = filterSel.value;
    const filtered = flags.filter(f => {
      if (filterMode === 'all') return true;
      if (filterMode === 'active') return f.status === 'open' || f.status === 'in-progress';
      return f.status === filterMode;
    });
    const sorted = filtered.slice().sort((a, b) => {
      if (mode === 'days-open') return b.daysOpen - a.daysOpen;
      if (mode === 'week') return (a.weekRaised || 0) - (b.weekRaised || 0);
      if (mode === 'round') return a.roundLabel.localeCompare(b.roundLabel);
      if (mode === 'signal') return a.signalType.localeCompare(b.signalType);
      return 0;
    });
    if (sorted.length === 0) {
      listWrap.innerHTML = '';
      listWrap.appendChild(dashEmptyRow('No flags match this filter.', 'neutral'));
      return;
    }
    listWrap.innerHTML = '';
    sorted.forEach(f => {
      const row = document.createElement('div');
      row.className = 'dash-flag-row' + (f.daysOpen > 14 ? ' very-aged' : f.daysOpen > 7 ? ' aged' : '');
      row.title = f.description;
      const tag = document.createElement('span');
      tag.className = 'signal-type ' + f.signalType.toLowerCase().replace(/\s+/g, '-');
      tag.textContent = f.signalType;
      row.appendChild(tag);
      const middle = document.createElement('div');
      const statusBadgeCls = f.status === 'resolved' ? 'status-green' : f.status === 'in-progress' ? 'status-amber' : 'status-grey';
      const statusLabel = f.status === 'resolved' ? 'Resolved' : f.status === 'in-progress' ? 'In progress' : 'Open';
      middle.innerHTML = `
        <div class="desc">${escapeHtml(f.description)}</div>
        <div class="meta">${escapeHtml(f.roundLabel)} / ${escapeHtml(f.cohortLabel)} / ${escapeHtml(f.sectionTitle)}${f.weekRaised != null ? ' / Week ' + f.weekRaised : ''} / Owner: ${escapeHtml(f.owner || 'Course Ops Lead')}</div>
        <div class="meta"><span class="status-badge ${statusBadgeCls}" style="margin-top:4px;">${statusLabel}</span></div>
      `;
      row.appendChild(middle);
      const days = document.createElement('div');
      days.className = 'days-open';
      days.textContent = f.daysOpen + ' day' + (f.daysOpen === 1 ? '' : 's') + ' open';
      row.appendChild(days);
      const btn = document.createElement('button');
      btn.className = 'btn btn-small';
      btn.textContent = 'Log action';
      btn.addEventListener('click', () => openLogActionModal(f));
      row.appendChild(btn);
      listWrap.appendChild(row);
    });
  }
  sortSel.addEventListener('change', paint);
  filterSel.addEventListener('change', paint);
  paint();
  return sec;
}

function renderDashboardActiveRoundsSection() {
  const sec = document.createElement('div');
  sec.className = 'dash-section';
  const heading = document.createElement('h2');
  heading.textContent = 'Active rounds';
  sec.appendChild(heading);
  const cards = dashboardActiveCards();
  cards.forEach(c => {
    const row = document.createElement('div');
    row.className = 'dash-active-card';
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.style.cursor = 'pointer';
    const navTo = () => {
      if (c.kind === 'launch') { store.mode = 'launch'; store.activeRound = c.roundKey; store.view = 'summary'; }
      else { store.mode = 'midround'; store.activeMidroundRound = c.roundKey; store.midroundView = 'summary'; }
      saveStore();
      render();
    };
    row.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('a')) return;
      navTo();
    });
    row.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navTo(); }
    });
    const left = document.createElement('div');
    let metaLine = '';
    if (c.kind === 'launch') {
      const dayLine = c.days != null
        ? (c.days >= 0 ? c.days + ' day' + (c.days === 1 ? '' : 's') + ' to launch' : 'Launched ' + Math.abs(c.days) + ' days ago')
        : 'No launch date set';
      metaLine = dayLine + ' / Checklist ' + c.pct + '% / ' + c.openIssues + ' open ' + (c.openIssues === 1 ? 'issue' : 'issues');
    } else {
      metaLine = 'Week ' + c.currentWeek + ' of ' + c.weeks + ' / Week check ' + c.checkStatus + ' / ' + c.openActions + ' open ' + (c.openActions === 1 ? 'action' : 'actions');
    }
    const blockedHtml = (c.blockedItems && c.blockedItems.length > 0)
      ? '<ul class="blocked-list">' + c.blockedItems.map(b => '<li>' + escapeHtml(b) + '</li>').join('') + (c.openIssues > 3 || c.openActions > 3 ? '<li class="blocked-more">' + ((c.openIssues || c.openActions) - 3) + ' more</li>' : '') + '</ul>'
      : '';
    left.innerHTML = `
      <div class="head">${escapeHtml(c.title)}<span class="mode-pill">${escapeHtml(c.modeLabel)}</span></div>
      <div class="meta">${escapeHtml(c.course)}</div>
      <div class="meta">${escapeHtml(metaLine)}</div>
      ${blockedHtml}
    `;
    row.appendChild(left);
    const right = document.createElement('div');
    right.className = 'right';
    const badge = document.createElement('span');
    badge.className = 'status-badge ' + c.statusCls;
    badge.textContent = c.statusLabel;
    right.appendChild(badge);
    const jump = document.createElement('button');
    jump.className = 'btn btn-small';
    jump.textContent = 'Jump in';
    jump.addEventListener('click', () => {
      if (c.kind === 'launch') {
        store.mode = 'launch';
        store.activeRound = c.roundKey;
        store.view = 'summary';
      } else {
        store.mode = 'midround';
        store.activeMidroundRound = c.roundKey;
        store.midroundView = 'summary';
      }
      saveStore();
      render();
    });
    right.appendChild(jump);
    row.appendChild(right);
    sec.appendChild(row);
  });
  return sec;
}

function renderDashboardHeatmapSection() {
  const sec = document.createElement('div');
  sec.className = 'dash-section';
  const heading = document.createElement('h2');
  heading.textContent = 'Cohort heatmap';
  sec.appendChild(heading);

  const launchRounds = getActiveLaunchRounds();
  const midroundRounds = getActiveMidroundRounds();
  if (launchRounds.length === 0 && midroundRounds.length === 0) {
    sec.appendChild(dashEmptyRow('No active rounds. The heatmap will populate when you start a launching or mid-round round.', 'neutral'));
    return sec;
  }

  const maxWeeks = Math.max(5, ...midroundRounds.map(r => r.weeks || 5));
  const wrap = document.createElement('div');
  wrap.className = 'heatmap';
  const grid = document.createElement('div');
  grid.className = 'heatmap-grid';
  grid.style.gridTemplateColumns = '160px 56px repeat(' + maxWeeks + ', minmax(40px, 1fr))';

  // Header row
  const empty = document.createElement('div');
  empty.className = 'heatmap-cell row-label';
  empty.textContent = 'Cohort';
  grid.appendChild(empty);
  const launchHead = document.createElement('div');
  launchHead.className = 'heatmap-cell col-label';
  launchHead.textContent = 'Launch';
  grid.appendChild(launchHead);
  for (let w = 1; w <= maxWeeks; w++) {
    const h = document.createElement('div');
    h.className = 'heatmap-cell col-label';
    h.textContent = 'W' + w;
    grid.appendChild(h);
  }

  // Rows for launch rounds
  launchRounds.forEach(round => {
    round.cohorts.forEach((cohort, ci) => {
      const label = document.createElement('div');
      label.className = 'heatmap-cell row-label';
      label.textContent = 'R' + round.roundNumber + ': ' + cohort.label;
      grid.appendChild(label);

      const checked = Object.values(cohort.state.checks).filter(Boolean).length;
      const pct = TOTAL_ITEMS ? checked / TOTAL_ITEMS : 0;
      const launchCell = document.createElement('button');
      let cls = 'grey';
      if (pct >= 0.9) cls = 'green';
      else if (pct >= 0.5) cls = 'amber';
      else if (pct > 0) cls = 'red';
      launchCell.className = 'heatmap-cell ' + cls;
      launchCell.textContent = Math.round(pct * 100) + '%';
      launchCell.setAttribute('aria-label', 'Launch readiness for ' + cohort.label + ' in Round ' + round.roundNumber);
      launchCell.addEventListener('click', () => {
        store.mode = 'launch';
        store.activeRound = String(round.roundNumber);
        store.activeCohort = ci;
        store.view = 'cohort';
        saveStore();
        render();
      });
      grid.appendChild(launchCell);

      for (let w = 1; w <= maxWeeks; w++) {
        const c = document.createElement('div');
        c.className = 'heatmap-cell disabled';
        c.textContent = '';
        grid.appendChild(c);
      }
    });
  });

  // Rows for midround rounds
  midroundRounds.forEach(round => {
    const current = currentWeekFor(round);
    round.cohorts.forEach((cohort, ci) => {
      const label = document.createElement('div');
      label.className = 'heatmap-cell row-label';
      label.textContent = 'R' + round.roundNumber + ': ' + cohort.label;
      grid.appendChild(label);

      const launchCell = document.createElement('div');
      launchCell.className = 'heatmap-cell disabled';
      grid.appendChild(launchCell);

      for (let w = 1; w <= maxWeeks; w++) {
        const cell = document.createElement('button');
        if (w > round.weeks) {
          cell.className = 'heatmap-cell disabled';
          grid.appendChild(cell);
          continue;
        }
        if (w > current) {
          cell.className = 'heatmap-cell grey';
          cell.textContent = '';
          cell.disabled = true;
          grid.appendChild(cell);
          continue;
        }
        const wd = cohort.weeks[String(w)];
        let cls = 'grey';
        let txt = '';
        if (wd) {
          const status = cohortMidroundStatus(cohort, w);
          if (status.cls === 'status-red') cls = 'red';
          else if (status.cls === 'status-amber') cls = 'amber';
          else if (status.cls === 'status-green') cls = 'green';
          else cls = 'grey';
          if (status.pulse != null) txt = String(Math.round(status.pulse * 10) / 10);
        }
        cell.className = 'heatmap-cell ' + cls;
        cell.textContent = txt;
        cell.setAttribute('aria-label', cohort.label + ' Round ' + round.roundNumber + ' Week ' + w);
        cell.addEventListener('click', () => {
          store.mode = 'midround';
          store.activeMidroundRound = String(round.roundNumber);
          store.activeMidroundCohort = ci;
          store.activeWeek = w;
          store.midroundView = 'cohort';
          saveStore();
          render();
        });
        grid.appendChild(cell);
      }
    });
  });

  wrap.appendChild(grid);
  const legend = document.createElement('div');
  legend.className = 'heatmap-legend';
  legend.innerHTML = '<span class="green">Healthy</span><span class="amber">Watch</span><span class="red">Needs action</span><span class="grey">Not reached / not applicable</span>';
  wrap.appendChild(legend);
  sec.appendChild(wrap);
  return sec;
}

function renderDashboardQuickActions() {
  const sec = document.createElement('div');
  sec.className = 'dash-section';
  const heading = document.createElement('h2');
  heading.textContent = 'Quick actions';
  sec.appendChild(heading);
  const row = document.createElement('div');
  row.style.display = 'flex';
  row.style.gap = '8px';
  row.style.flexWrap = 'wrap';

  // Most-pressing midround check
  const midroundRounds = getActiveMidroundRounds();
  if (midroundRounds.length > 0) {
    const ranked = midroundRounds.map(r => ({ r: r, cards: dashboardActiveCards().find(c => c.roundKey === String(r.roundNumber) && c.kind === 'midround') }))
      .filter(x => x.cards)
      .sort((a, b) => a.cards.urgency - b.cards.urgency);
    if (ranked.length > 0) {
      const r = ranked[0].r;
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = 'Run this week\'s check for Round ' + r.roundNumber;
      btn.addEventListener('click', () => {
        store.mode = 'midround';
        store.activeMidroundRound = String(r.roundNumber);
        store.midroundView = 'summary';
        saveStore();
        render();
      });
      row.appendChild(btn);
    }
  }

  // Continue setup if any launch round is in progress (pct < 90)
  const launchInProgress = getActiveLaunchRounds().filter(r => {
    const checked = r.cohorts.reduce((n, c) => n + Object.values(c.state.checks).filter(Boolean).length, 0);
    const total = r.cohorts.length * TOTAL_ITEMS;
    return total > 0 && checked / total < 0.9;
  });
  if (launchInProgress.length > 0) {
    const r = launchInProgress[0];
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'Continue setup for Round ' + r.roundNumber;
    btn.addEventListener('click', () => {
      store.mode = 'launch';
      store.activeRound = String(r.roundNumber);
      store.view = 'summary';
      saveStore();
      render();
    });
    row.appendChild(btn);
  }

  const startNew = document.createElement('button');
  startNew.className = 'btn';
  startNew.textContent = 'Start a new round';
  startNew.addEventListener('click', () => {
    store.modal = {
      type: 'confirm',
      title: 'Start a new round',
      message: 'Pick a mode. Launching is for the week before a round starts. Mid-round is for weekly checks during an active round.',
      confirmLabel: 'Start launching mode',
      confirmVariant: 'primary',
      cancelLabel: 'Cancel',
      secondaryLabel: 'Start mid-round mode',
      onConfirm: () => { store.mode = 'launch'; store.activeRound = null; store.view = 'setup'; saveStore(); closeModal(); },
      onSecondary: () => { store.mode = 'midround'; store.activeMidroundRound = null; store.midroundView = 'setup'; saveStore(); closeModal(); }
    };
    render();
  });
  row.appendChild(startNew);

  const spacer = document.createElement('div');
  spacer.style.flex = '1';
  row.appendChild(spacer);

  const exp = document.createElement('button');
  exp.className = 'btn btn-link';
  exp.textContent = 'Export this week\'s summary';
  exp.addEventListener('click', exportDashboardSummary);
  row.appendChild(exp);

  sec.appendChild(row);
  return sec;
}

function weekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function exportDashboardSummary() {
  const lines = [];
  const today = new Date();
  const dayName = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][today.getDay()];
  lines.push('# Ops weekly summary');
  lines.push('');
  lines.push('Date: ' + today.toISOString().slice(0, 10) + ' (' + dayName + ', week ' + weekNumber(today) + ')');
  lines.push('');

  const cards = dashboardActiveCards();
  lines.push('## Active rounds (' + cards.length + ')');
  lines.push('');
  if (cards.length === 0) {
    lines.push('No active rounds.');
    lines.push('');
  } else {
    cards.forEach(c => {
      if (c.kind === 'launch') {
        const dayStr = c.days != null ? (c.days >= 0 ? 'in ' + c.days + ' days' : Math.abs(c.days) + ' days ago') : 'no date';
        lines.push('- Round ' + c.roundKey + ' (launching) - launches ' + dayStr + ' - checklist ' + c.pct + '% - ' + c.openIssues + ' open issues - ' + c.statusLabel);
      } else {
        lines.push('- Round ' + c.roundKey + ' (mid-round) - week ' + c.currentWeek + ' of ' + c.weeks + ' - ' + c.checksDone + '/' + c.cohortCount + ' weekly checks done - ' + c.openActions + ' open actions - ' + c.statusLabel);
      }
    });
    lines.push('');
  }

  const flags = dashboardFlags();
  lines.push('## Open action-required (' + flags.length + ')');
  lines.push('');
  if (flags.length === 0) {
    lines.push('None.');
  } else {
    flags.slice().sort((a, b) => b.daysOpen - a.daysOpen).forEach(f => {
      lines.push('- ' + f.roundLabel + ' / ' + f.cohortLabel + ' / ' + f.sectionTitle + (f.weekRaised != null ? ' (W' + f.weekRaised + ')' : '') + ' - ' + f.daysOpen + ' days open - ' + f.description);
    });
  }
  lines.push('');

  const upcoming = dashboardUpcomingThisWeek();
  lines.push('## Upcoming this week');
  lines.push('');
  if (upcoming.length === 0) lines.push('Nothing scheduled.');
  else upcoming.forEach(u => lines.push('- ' + u.label + ' - ' + u.meta));
  lines.push('');

  lines.push('## Notable trends');
  lines.push('');
  const trends = [];
  getActiveMidroundRounds().forEach(round => {
    const current = currentWeekFor(round);
    round.cohorts.forEach(c => {
      const t = pulseTrend(c, current);
      if (t === 'declining') trends.push('Round ' + round.roundNumber + ' / ' + c.label + ': pulse declining');
    });
  });
  if (trends.length === 0) lines.push('No declining trends.');
  else trends.forEach(t => lines.push('- ' + t));

  const md = lines.join('\n');
  const filename = 'tais-ops-weekly-summary-' + today.toISOString().slice(0, 10) + '.md';
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ----------------------------- INIT -----------------------------

let store = loadStore();
// ?demo=1 wipes localStorage and seeds a realistic R7+R8 state for demos and walkthroughs.
maybeHandleDemoUrl();
// Default to dashboard on every load if any rounds exist (per spec: "first thing seen on every visit")
if (hasAnyActiveRounds()) store.mode = 'dashboard';
ensureCourseDatalist();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (store.modal) { closeModal(); return; }
    if (store.failurePanelOpen) { store.failurePanelOpen = false; render(); return; }
    if (store.escalationPanelOpen) { store.escalationPanelOpen = false; render(); }
  }
});

render();
</script>
