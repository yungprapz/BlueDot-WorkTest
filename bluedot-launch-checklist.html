<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueDot Round Operations</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-alt: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --text-muted: #71717a;
    --text-subtle: #a1a1aa;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-md: #0d9488;
    --accent-md-hover: #0f766e;
    --accent-md-soft: #ccfbf1;
    --green-bg: #dcfce7;
    --green-fg: #166534;
    --green-solid: #16a34a;
    --amber-bg: #fef3c7;
    --amber-fg: #92400e;
    --amber-solid: #d97706;
    --red-bg: #fee2e2;
    --red-fg: #991b1b;
    --red-solid: #dc2626;
    --grey-bg: #f4f4f5;
    --grey-fg: #52525b;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.06);
    --focus: 0 0 0 2px var(--accent);
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --fs-xs: 12px;
    --fs-sm: 13px;
    --fs-md: 15px;
    --fs-lg: 18px;
    --fs-xl: 22px;
    --fs-2xl: 32px;
  }
  [data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #18181b;
    --surface-alt: #27272a;
    --border: #27272a;
    --border-strong: #3f3f46;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --text-subtle: #71717a;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-md: #2dd4bf;
    --accent-md-hover: #5eead4;
    --accent-md-soft: #134e4a;
    --green-bg: #14532d;
    --green-fg: #bbf7d0;
    --green-solid: #22c55e;
    --amber-bg: #78350f;
    --amber-fg: #fed7aa;
    --amber-solid: #f59e0b;
    --red-bg: #7f1d1d;
    --red-fg: #fecaca;
    --red-solid: #ef4444;
    --grey-bg: #27272a;
    --grey-fg: #d4d4d8;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  button {
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
  }
  input, textarea, select {
    font-family: inherit;
    font-size: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 8px 10px;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 60px; }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  .header-meta {
    font-size: 13px;
    color: var(--text-muted);
  }
  .header-spacer { flex: 1; }
  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
  }
  .nav-tab {
    background: transparent;
    border: none;
    padding: 10px 14px;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-weight: 500;
    white-space: nowrap;
  }
  .nav-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .nav-tab:hover { color: var(--text); }

  .main {
    flex: 1;
    padding: 24px;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  .btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 7px 12px;
    font-weight: 500;
    transition: background 0.1s, border-color 0.1s;
  }
  .btn:hover { background: var(--surface-alt); }
  .btn-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-secondary {
    background: var(--surface);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 500;
  }
  .btn-secondary:hover { background: var(--surface-alt); }
  .btn-danger {
    color: var(--red-fg);
    border-color: var(--border-strong);
  }
  .btn-small { padding: 4px 8px; font-size: 13px; }
  .btn-link {
    background: transparent;
    border: none;
    color: var(--accent);
    padding: 0;
    text-decoration: underline;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .setup-wrap {
    max-width: 520px;
    margin: 40px auto;
  }
  .form-row { margin-bottom: 16px; }
  .form-row label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .form-row .hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .summary-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .summary-meta .item .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .summary-meta .item .value { font-size: 18px; font-weight: 600; }

  .cohort-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .cohort-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    transition: border-color 0.1s, transform 0.1s;
    box-shadow: var(--shadow);
  }
  .cohort-card:hover {
    border-color: var(--border-strong);
  }
  .cohort-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    gap: 8px;
  }
  .cohort-card-title { font-weight: 600; font-size: 15px; }
  .progress-bar {
    height: 6px;
    background: var(--surface-alt);
    border-radius: 3px;
    overflow: hidden;
    margin: 12px 0 8px;
  }
  .progress-fill {
    height: 100%;
    transition: width 0.2s;
  }
  .cohort-card-foot {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-muted);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .status-badge::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-green { background: var(--green-bg); color: var(--green-fg); }
  .status-amber { background: var(--amber-bg); color: var(--amber-fg); }
  .status-red { background: var(--red-bg); color: var(--red-fg); }
  .status-grey { background: var(--grey-bg); color: var(--grey-fg); }

  .breadcrumb {
    margin-bottom: 16px;
    font-size: 14px;
    color: var(--text-muted);
  }
  .breadcrumb button { background: none; border: none; color: var(--accent); padding: 0; cursor: pointer; }
  .breadcrumb button:hover { text-decoration: underline; }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--surface);
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
    color: var(--text);
  }
  .section-head:hover { background: var(--surface-alt); }
  .section-title { font-weight: 600; font-size: 15px; }
  .section-meta { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--text-muted); }
  .section-body { padding: 0 18px 12px; border-top: 1px solid var(--border); }
  .section.collapsed .section-body { display: none; }
  .chevron {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-right: 2px solid var(--text-muted);
    border-bottom: 2px solid var(--text-muted);
    transform: rotate(45deg);
    margin-left: 8px;
    transition: transform 0.15s;
  }
  .section.collapsed .chevron { transform: rotate(-45deg); }

  .item {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .item:last-child { border-bottom: none; }
  .item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-top: 2px;
    cursor: pointer;
    accent-color: var(--accent);
  }
  .item-label {
    cursor: pointer;
    line-height: 1.5;
  }
  .item-label.checked { color: var(--text-muted); text-decoration: line-through; }
  .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .item-note {
    grid-column: 2 / -1;
    margin-top: 6px;
    background: var(--surface-alt);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    border-left: 3px solid var(--accent);
  }
  .item-note textarea { width: 100%; background: var(--surface); }
  .has-note { color: var(--accent); }

  .edge-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-top: 20px;
  }
  .edge-section h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .edge-section p { margin: 0 0 14px; font-size: 13px; color: var(--text-muted); }
  .edge-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .edge-item:last-child { border-bottom: none; }
  .edge-toggle { display: flex; gap: 4px; }
  .edge-toggle button {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .edge-toggle button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .edge-toggle button.active.na {
    background: var(--text-muted);
    border-color: var(--text-muted);
  }

  .issues-list { display: flex; flex-direction: column; gap: 8px; }
  .issue-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: start;
  }
  .issue-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .issue-desc { font-weight: 500; margin-bottom: 6px; }
  .issue-resolution { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .issue-form { display: grid; gap: 10px; }
  .issue-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Failure panel */
  .panel-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .panel-backdrop.open { opacity: 1; pointer-events: auto; }
  .failure-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(720px, 100%);
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 30;
    transform: translateX(100%);
    transition: transform 0.2s;
    overflow-y: auto;
  }
  .failure-panel.open { transform: translateX(0); }
  .failure-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  .failure-panel h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .failure-panel-body { padding: 16px 20px; }
  .failure-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .failure-table th, .failure-table td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .failure-table th {
    background: var(--surface-alt);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 40;
    padding: 20px;
  }
  .modal {
    background: var(--surface);
    border-radius: 10px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .modal h3 { margin-top: 0; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 640px) {
    .main { padding: 16px; }
    .header { padding: 10px 16px; }
    .nav { padding: 0 16px; }
    .summary-meta { padding: 12px; }
    .item { grid-template-columns: auto 1fr; }
    .item-actions { grid-column: 2; margin-top: 4px; }
    .issue-form .row { grid-template-columns: 1fr; }
  }

  /* Mode switcher and mid-round styles */
  [data-mode="midround"] {
    --accent: var(--accent-md);
    --accent-hover: var(--accent-md-hover);
    --focus: 0 0 0 2px var(--accent-md);
  }
  .mode-switcher {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .mode-switcher-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 8px;
  }
  .mode-tab {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 500;
    color: var(--text-muted);
    font-size: 14px;
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.2;
    text-align: left;
  }
  .mode-tab .sub {
    font-size: 11px;
    font-weight: 400;
    opacity: 0.7;
    margin-top: 2px;
  }
  .mode-tab:hover { color: var(--text); background: var(--surface-alt); }
  .mode-tab.active .sub { opacity: 0.9; }
  .mode-tab.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .mode-tab.active.launch-tab { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mode-tab.active.midround-tab { background: var(--accent-md); border-color: var(--accent-md); color: #fff; }
  [data-theme="dark"] .mode-tab.active.midround-tab { color: #0a0a0a; }

  /* Orientation card */
  .orientation {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 22px;
    margin-bottom: 18px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.55;
  }
  .orientation strong { color: var(--text); }

  /* Week tabs (mid-round cohort view) */
  .week-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    margin: 16px 0;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .week-tab {
    background: transparent;
    border: none;
    padding: 8px 14px;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    font-weight: 500;
  }
  .week-tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .week-tab .week-status {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Mid-round item types */
  .md-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    display: grid;
    gap: 8px;
  }
  .md-item:last-child { border-bottom: none; }
  .md-item-label { font-weight: 500; font-size: 14px; }
  .md-item .hint-inline { font-size: 13px; color: var(--text-muted); }
  .md-item input[type="number"], .md-item input[type="text"] { max-width: 320px; }
  .md-item textarea { min-height: 56px; }
  .md-radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .md-radio-group button {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 5px 12px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .md-radio-group button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .md-action-required {
    background: var(--amber-bg);
    color: var(--amber-fg);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    border-left: 3px solid var(--amber-solid);
  }
  .md-action-required.resolved {
    background: var(--green-bg);
    color: var(--green-fg);
    border-left-color: var(--green-solid);
  }
  .md-action-required textarea {
    margin-top: 6px;
    background: var(--surface);
  }

  /* Action Required panel (sticky top banner) */
  .action-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--amber-solid);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 16px;
  }
  .action-banner.empty { border-left-color: var(--green-solid); }
  .action-banner-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .action-banner h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .action-list { margin: 0; padding: 0; list-style: none; }
  .action-list li {
    padding: 8px 0;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    font-size: 13px;
  }
  .action-list li:first-child { border-top: 1px solid var(--border); }
  .action-list-meta { color: var(--text-muted); font-size: 12px; }

  /* Trend chart */
  .trend-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .trend-block h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .trend-block .trend-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .trend-svg { display: block; width: 100%; height: 120px; }
  .trend-svg .axis { stroke: var(--border-strong); stroke-width: 1; }
  .trend-svg .grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3; }
  .trend-svg .line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .trend-svg .dot { fill: var(--accent); }

// =============================================================================
//                     LAUNCH -> MID-ROUND AUTO-CONVERSION
// =============================================================================

// A launch round is "ready to convert" when its session 1 date has passed
// and the user has not yet completed the conversion wizard.
function findLaunchReadyToConvert() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const ready = [];
  Object.keys(store.rounds || {}).forEach(key => {
    const round = store.rounds[key];
    if (!round.session1Date) return;
    if (round.conversionDeclinedAt) return;
    const session = new Date(round.session1Date + 'T00:00:00');
    if (session <= today) ready.push(round);
  });
  return ready;
}

function convertLaunchToMidround(launchKey, facilitators, weeks) {
  const launch = store.rounds[launchKey];
  if (!launch) return null;
  const target = String(launch.roundNumber);
  if (store.midroundRounds[target]) {
    alert('Round ' + launch.roundNumber + ' already exists in mid-round mode. Cannot convert.');
    return null;
  }
  const openIssues = (launch.issues || []).filter(i => i.status !== 'resolved');
  const priorSnapshot = launch.cohorts.map(c => ({
    label: c.label,
    checks: Object.assign({}, c.state.checks),
    notes: Object.assign({}, c.state.notes),
    edgeCases: Object.assign({}, c.state.edgeCases)
  }));
  const midround = {
    roundNumber: launch.roundNumber,
    courseName: launch.courseName,
    session1Date: launch.session1Date,
    weeks: weeks || 5,
    cohorts: launch.cohorts.map((c, i) => ({
      label: c.label,
      facilitator: (facilitators[i] || '').trim(),
      weeks: {}
    })),
    createdAt: launch.createdAt,
    convertedFromLaunchAt: new Date().toISOString(),
    issues: openIssues,
    priorLaunchSnapshot: priorSnapshot,
    closed: false
  };
  store.midroundRounds[target] = midround;
  delete store.rounds[launchKey];
  if (store.activeRound === launchKey) store.activeRound = null;
  saveStore();
  return midround;
}

function declineLaunchConversion(launchKey) {
  const launch = store.rounds[launchKey];
  if (!launch) return;

// ----------------------------- STATE -----------------------------

function defaultStore() {
  return {
    rounds: {},
    activeRound: null,
    darkMode: false,
    view: 'setup',
    activeCohort: 0,
    collapsedSections: {},
    expandedNotes: {},
    failurePanelOpen: false,
    modal: null,
    mode: 'launch',
    midroundRounds: {},
    activeMidroundRound: null,
    activeMidroundCohort: 0,
    activeWeek: 1,
    midroundView: 'summary',
    escalationPanelOpen: false,
    archivedMidroundRounds: {}
  };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultStore();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultStore(), parsed);
  } catch (e) {
    return defaultStore();
  }
}

function saveStore() {
  const persistable = {
    rounds: store.rounds,
    activeRound: store.activeRound,
    darkMode: store.darkMode,
    view: store.view,
    activeCohort: store.activeCohort,
    mode: store.mode,
    midroundRounds: store.midroundRounds,
    activeMidroundRound: store.activeMidroundRound,
    activeMidroundCohort: store.activeMidroundCohort,
    activeWeek: store.activeWeek,
    midroundView: store.midroundView,
    archivedMidroundRounds: store.archivedMidroundRounds
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(persistable));
  } catch (e) {
    console.error('Failed to save', e);
  }
}

function activeRound() {
  if (!store.activeRound) return null;
  return store.rounds[store.activeRound] || null;
}

function newCohortState() {
  return { checks: {}, notes: {}, edgeCases: {} };
}

function createRound(setup) {
  const cohorts = [];
  for (let i = 0; i < setup.numCohorts; i++) {
    cohorts.push({
      label: setup.cohortLabels[i] || ('Cohort ' + (i + 1)),
      state: newCohortState()
    });
  }
  const round = {
    roundNumber: setup.roundNumber,
    courseName: setup.courseName,
    session1Date: setup.session1Date,
    cohorts: cohorts,
    issues: [],
    createdAt: new Date().toISOString()
  };
  store.rounds[String(setup.roundNumber)] = round;
  store.activeRound = String(setup.roundNumber);
  store.view = 'summary';
  store.activeCohort = 0;
  saveStore();
}

function updateRoundSetup(setup) {
  const round = activeRound();
  if (!round) return;
  round.roundNumber = setup.roundNumber;
  round.courseName = setup.courseName;
  round.session1Date = setup.session1Date;
  const oldCount = round.cohorts.length;
  if (setup.numCohorts > oldCount) {
    for (let i = oldCount; i < setup.numCohorts; i++) {
      round.cohorts.push({
        label: setup.cohortLabels[i] || ('Cohort ' + (i + 1)),
        state: newCohortState()
      });
    }
  } else if (setup.numCohorts < oldCount) {
    round.cohorts = round.cohorts.slice(0, setup.numCohorts);
  }
  for (let i = 0; i < setup.numCohorts; i++) {
    if (setup.cohortLabels[i]) round.cohorts[i].label = setup.cohortLabels[i];
  }
  if (String(setup.roundNumber) !== store.activeRound) {
    delete store.rounds[store.activeRound];
    store.rounds[String(setup.roundNumber)] = round;
    store.activeRound = String(setup.roundNumber);
  }
  saveStore();
}

// ----------------------------- COMPUTED -----------------------------

function cohortProgress(cohort) {
  const checked = Object.values(cohort.state.checks).filter(Boolean).length;
  return { checked: checked, total: TOTAL_ITEMS, pct: TOTAL_ITEMS ? Math.round((checked / TOTAL_ITEMS) * 100) : 0 };
}

function sectionProgress(cohort, section) {
  const checked = section.items.filter(it => cohort.state.checks[it.id]).length;
  return { checked: checked, total: section.items.length };
}

function statusFor(pct, started) {
  if (!started) return { cls: 'status-grey', label: 'Not started' };
  if (pct >= 90) return { cls: 'status-green', label: 'Ready' };
  if (pct >= 50) return { cls: 'status-amber', label: 'In progress' };
  return { cls: 'status-red', label: 'Not ready' };
}

function progressColor(pct, started) {
  if (!started) return 'var(--text-subtle)';
  if (pct >= 90) return 'var(--green-fg)';
  if (pct >= 50) return 'var(--amber-fg)';
  return 'var(--red-fg)';
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const diffMs = target - now;
  return Math.round(diffMs / (1000 * 60 * 60 * 24));
}

function countdownLabel(dateStr) {
  const d = daysUntil(dateStr);
  if (d === null) return '';
  if (d === 0) return 'Launches today';
  if (d === 1) return '1 day to launch';
  if (d > 1) return d + ' days to launch';
  if (d === -1) return 'Launched 1 day ago';
  return 'Launched ' + Math.abs(d) + ' days ago';
}

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function render() {
  document.documentElement.setAttribute('data-theme', store.darkMode ? 'dark' : 'light');
  document.documentElement.setAttribute('data-mode', store.mode || 'launch');
  $app.innerHTML = '';
  // Auto-detect any launch round whose session 1 has arrived and prompt for conversion.
  // Skips when another modal is already open (handled inside the function).
  if (!store.modal) maybeOpenConversionWizard();

  if (store.mode === 'dashboard') {
    renderDashboardMode();
  } else if (store.mode === 'midround') {
    renderMidround();
  } else {
    renderLaunch();
  }

  $app.appendChild(renderFailurePanel());
  $app.appendChild(renderEscalationPanel());
  if (store.modal) $app.appendChild(renderModal());
}

function renderDashboardMode() {
  $app.appendChild(renderHeader(true));
  $app.appendChild(renderModeSwitcher());
  const main = document.createElement('main');
  main.className = 'main';
  main.id = 'main-content';
  main.appendChild(renderDashboard());
  $app.appendChild(main);
}

function renderLaunch() {
  if (!activeRound()) {
    store.view = 'setup';
    $app.appendChild(renderHeader(true));
    $app.appendChild(renderModeSwitcher());
    $app.appendChild(renderSetup(null));
  } else {
    $app.appendChild(renderHeader(false));
    $app.appendChild(renderModeSwitcher());
    $app.appendChild(renderNav());
    const main = document.createElement('main');
    main.className = 'main';
    main.id = 'main-content';
    if (store.view === 'setup') main.appendChild(renderSetup(activeRound()));
    else if (store.view === 'summary') main.appendChild(renderSummary());
    else if (store.view === 'cohort') main.appendChild(renderCohort());
    else if (store.view === 'issues') main.appendChild(renderIssues());
    $app.appendChild(main);
  }
}

function renderMidround() {
  if (!activeMidroundRound()) {
    if (store.midroundView === 'pastRounds') {
      $app.appendChild(renderHeader(true));
      $app.appendChild(renderModeSwitcher());
      const main = document.createElement('main');
      main.className = 'main';
      main.id = 'main-content';
      main.appendChild(renderPastRounds());
      $app.appendChild(main);
      return;
    }
    store.midroundView = 'setup';
    $app.appendChild(renderHeader(true));
    $app.appendChild(renderModeSwitcher());
    $app.appendChild(renderMidroundSetup(null));
  } else {
    $app.appendChild(renderHeader(false));
    $app.appendChild(renderModeSwitcher());
    $app.appendChild(renderMidroundNav());
    const main = document.createElement('main');
    main.className = 'main';
    main.id = 'main-content';
    const v = store.midroundView;
    if (v === 'setup') main.appendChild(renderMidroundSetup(activeMidroundRound()));
    else if (v === 'summary') main.appendChild(renderMidroundSummary());
    else if (v === 'cohort') main.appendChild(renderMidroundCohort());
    else if (v === 'trends') main.appendChild(renderTrendView());
    else if (v === 'pastRounds') main.appendChild(renderPastRounds());
    else main.appendChild(renderMidroundSummary());
    $app.appendChild(main);
  }
}

function renderModeSwitcher() {

  bar.className = 'mode-switcher';
  const label = document.createElement('span');
  label.className = 'visually-hidden';
  label.textContent = 'Mode';
  bar.appendChild(label);

  const dashTab = document.createElement('button');
  dashTab.className = 'mode-tab dashboard-tab' + (store.mode === 'dashboard' ? ' active' : '');
  dashTab.innerHTML = 'Dashboard<span class="sub">What needs attention</span>';
  dashTab.addEventListener('click', () => { store.mode = 'dashboard'; saveStore(); render(); });
  bar.appendChild(dashTab);

  const launchTab = document.createElement('button');
  launchTab.className = 'mode-tab launch-tab' + (store.mode === 'launch' ? ' active' : '');
  launchTab.innerHTML = 'Launching a round<span class="sub">Pre-launch checklist</span>';
  launchTab.addEventListener('click', () => { store.mode = 'launch'; saveStore(); render(); });
  bar.appendChild(launchTab);

  const mdTab = document.createElement('button');
  mdTab.className = 'mode-tab midround-tab' + (store.mode === 'midround' ? ' active' : '');

}

// ----------------------------- HEADER -----------------------------

function renderHeader(setupOnly) {
  const isDashboard = store.mode === 'dashboard';
  const isMidround = store.mode === 'midround';
  const round = isDashboard ? null : (isMidround ? activeMidroundRound() : activeRound());
  const header = document.createElement('header');
  header.className = 'header';
  const title = document.createElement('div');
  let titleText;
  if (isDashboard) titleText = 'Course Operations';
  else if (isMidround) titleText = 'Mid-Round Health Check';
  else titleText = 'Pre-Round Launch Checklist';
  title.innerHTML = '<h1 class="header-title">' + titleText + '</h1>';
  if (isDashboard) {
    const meta = document.createElement('div');
    meta.className = 'header-meta';
    const total = getActiveLaunchRounds().length + getActiveMidroundRounds().length;
    meta.textContent = total === 0 ? 'No active rounds' : (total === 1 ? '1 active round' : total + ' active rounds');
    title.appendChild(meta);
  } else if (round) {
    const meta = document.createElement('div');
    meta.className = 'header-meta';
    let metaText = 'Round ' + round.roundNumber + ' / ' + round.courseName;
    if (isMidround) {
      const wk = currentWeekFor(round);
      metaText += ' / Week ' + wk + ' of ' + round.weeks;
    }
    meta.textContent = metaText;
    title.appendChild(meta);
  }
  header.appendChild(title);

  const spacer = document.createElement('div');
  spacer.className = 'header-spacer';
  header.appendChild(spacer);

  const actions = document.createElement('div');
  actions.className = 'header-actions';

  if (!setupOnly) {
    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn-small';
    editBtn.textContent = 'Edit setup';
    editBtn.addEventListener('click', () => {
      if (isMidround) { store.midroundView = 'setup'; }
      else { store.view = 'setup'; }
      render();
    });
    actions.appendChild(editBtn);

    if (isMidround) {
      const escBtn = document.createElement('button');
      escBtn.className = 'btn btn-small';
      escBtn.textContent = 'Escalation guide';
      escBtn.addEventListener('click', () => { store.escalationPanelOpen = true; render(); });
      actions.appendChild(escBtn);

      const pastBtn = document.createElement('button');
      pastBtn.className = 'btn btn-small';
      pastBtn.textContent = 'Past rounds';
      pastBtn.addEventListener('click', () => { store.midroundView = 'pastRounds'; saveStore(); render(); });
      actions.appendChild(pastBtn);

      const exportBtn = document.createElement('button');
      exportBtn.className = 'btn btn-small';
      exportBtn.textContent = 'Export';
      exportBtn.addEventListener('click', exportMidroundMarkdown);
      actions.appendChild(exportBtn);

      const closeBtn = document.createElement('button');
      closeBtn.className = 'btn btn-small btn-danger';
      closeBtn.textContent = 'Close out round';
      closeBtn.addEventListener('click', startCloseOutFlow);
      actions.appendChild(closeBtn);
    } else {
      const failBtn = document.createElement('button');
      failBtn.className = 'btn btn-small';
      failBtn.textContent = 'Failure response';
      failBtn.addEventListener('click', () => { store.failurePanelOpen = true; render(); });
      actions.appendChild(failBtn);

      const exportBtn = document.createElement('button');
      exportBtn.className = 'btn btn-small';
      exportBtn.textContent = 'Export';
      exportBtn.addEventListener('click', exportMarkdown);
      actions.appendChild(exportBtn);

      const newRoundBtn = document.createElement('button');
      newRoundBtn.className = 'btn btn-small btn-danger';
      newRoundBtn.textContent = 'New round';
      newRoundBtn.addEventListener('click', confirmNewRound);
      actions.appendChild(newRoundBtn);
    }
  }

  const themeBtn = document.createElement('button');
  themeBtn.className = 'btn btn-small';
  themeBtn.textContent = store.darkMode ? 'Light mode' : 'Dark mode';
  themeBtn.setAttribute('aria-label', 'Toggle colour theme');
  themeBtn.addEventListener('click', () => { store.darkMode = !store.darkMode; saveStore(); render(); });
  actions.appendChild(themeBtn);

  header.appendChild(actions);
  return header;
}

function renderNav() {
  const round = activeRound();
  const nav = document.createElement('nav');
  nav.className = 'nav';
  nav.setAttribute('aria-label', 'Sections');
  const tabs = [
    { id: 'summary', label: 'Round summary' },
    { id: 'issues', label: 'Issue log (' + round.issues.length + ')' }

// ----------------------------- SETUP -----------------------------

function renderSetup(existing) {
  const wrap = document.createElement('div');
  wrap.className = 'setup-wrap';

  if (!existing) wrap.appendChild(renderOrientation());

  const card = document.createElement('div');
  card.className = 'card';

  const heading = document.createElement('h2');
  heading.style.marginTop = '0';
  heading.textContent = existing ? 'Edit round setup' : 'Set up a new round';
  card.appendChild(heading);

  const desc = document.createElement('p');
  desc.style.color = 'var(--text-muted)';
  desc.style.marginTop = '0';
  desc.textContent = existing
    ? 'Update any field below. Existing progress for current cohorts is preserved.'
    : 'Enter round details to generate one checklist per cohort.';
  card.appendChild(desc);

  const initial = existing || { roundNumber: '', courseName: 'Technical AI Safety Course', session1Date: '', numCohorts: 6, cohortLabels: [] };

  card.appendChild(formRow('Round number', `<input type="number" id="setup-round" min="1" value="${escapeHtml(initial.roundNumber)}" required>`));
  card.appendChild(formRow('Course name', `<input type="text" id="setup-course" value="${escapeHtml(initial.courseName)}" list="bluedot-courses" placeholder="Pick a BlueDot course or type your own" required>`));
  card.appendChild(formRow('First session date', `<input type="date" id="setup-date" value="${escapeHtml(initial.session1Date)}" required>`));
  card.appendChild(formRow('Number of cohorts', `<input type="number" id="setup-num" min="1" max="12" value="${existing ? existing.cohorts.length : initial.numCohorts}" required>`));

  const labelsWrap = document.createElement('div');
  labelsWrap.className = 'form-row';
  const labelsLabel = document.createElement('label');
  labelsLabel.textContent = 'Cohort labels';
  const labelsHint = document.createElement('div');
  labelsHint.className = 'hint';
  labelsHint.textContent = 'One label per cohort. Defaults to Cohort N if left blank.';
  const labelsList = document.createElement('div');
  labelsList.id = 'setup-labels';
  labelsList.style.display = 'grid';
  labelsList.style.gap = '6px';
  labelsList.style.marginTop = '6px';
  labelsWrap.appendChild(labelsLabel);
  labelsWrap.appendChild(labelsList);
  labelsWrap.appendChild(labelsHint);
  card.appendChild(labelsWrap);

  const seedLabels = existing ? existing.cohorts.map(c => c.label) : Array.from({ length: initial.numCohorts }, (_, i) => 'Cohort ' + (i + 1));
  renderLabelInputs(labelsList, seedLabels);

  card.querySelector('#setup-num').addEventListener('input', e => {
    const n = Math.max(1, Math.min(12, Number(e.target.value) || 1));
    const current = Array.from(labelsList.querySelectorAll('input')).map(i => i.value);
    const next = Array.from({ length: n }, (_, i) => current[i] || ('Cohort ' + (i + 1)));
    renderLabelInputs(labelsList, next);
  });

  const actions = document.createElement('div');
  actions.style.display = 'flex';
  actions.style.gap = '8px';
  actions.style.marginTop = '20px';

  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn btn-primary';
  submitBtn.textContent = existing ? 'Save changes' : 'Create round';
  submitBtn.addEventListener('click', () => {
    const setup = {
      roundNumber: Number(card.querySelector('#setup-round').value),
      courseName: card.querySelector('#setup-course').value.trim() || 'Technical AI Safety Course',
      session1Date: card.querySelector('#setup-date').value,
      numCohorts: Math.max(1, Math.min(12, Number(card.querySelector('#setup-num').value) || 1)),
      cohortLabels: Array.from(labelsList.querySelectorAll('input')).map(i => i.value.trim())
    };
    if (!setup.roundNumber || !setup.session1Date) {
      alert('Round number and first session date are required.');
      return;
    }
    if (existing) {
      const newKey = String(setup.roundNumber);
      if (newKey !== store.activeRound && store.rounds[newKey]) {
        alert('Round ' + setup.roundNumber + ' already exists. Pick a different round number.');
        return;
      }
      const oldCount = existing.cohorts.length;
      if (setup.numCohorts < oldCount) {
        const dropped = [];
        for (let i = setup.numCohorts; i < oldCount; i++) {
          const c = existing.cohorts[i];
          const checks = Object.values(c.state.checks).filter(Boolean).length;
          const notes = Object.keys(c.state.notes).length;
          const edges = Object.values(c.state.edgeCases).filter(Boolean).length;
          if (checks + notes + edges > 0) dropped.push(c.label);
        }
        if (dropped.length > 0) {
          const ok = confirm('Reducing cohort count will erase progress for: ' + dropped.join(', ') + '. Continue?');
          if (!ok) return;
        }
      }
      updateRoundSetup(setup);
    } else {
      createRound(setup);
    }
    store.view = 'summary';
    saveStore();
    render();
  });
  actions.appendChild(submitBtn);

  if (existing) {
    const cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', () => { store.view = 'summary'; render(); });
    actions.appendChild(cancel);
  }

  card.appendChild(actions);
  wrap.appendChild(card);
  return wrap;
}

function formRow(label, inputHtml) {
  const row = document.createElement('div');
  row.className = 'form-row';
  row.innerHTML = `<label>${escapeHtml(label)}</label>${inputHtml}`;
  return row;
}

function renderLabelInputs(container, labels) {
  container.innerHTML = '';
  labels.forEach((lab, i) => {
    const input = document.createElement('input');
    input.type = 'text';
    input.value = lab;
    input.setAttribute('aria-label', 'Label for cohort ' + (i + 1));
    container.appendChild(input);
  });
}

// ----------------------------- SUMMARY -----------------------------

function renderSummary() {
  const round = activeRound();
  const wrap = document.createElement('div');

  const meta = document.createElement('div');
  meta.className = 'summary-meta';
  meta.innerHTML = `
    <div class="item"><div class="label">Round</div><div class="value">${escapeHtml(round.roundNumber)}</div></div>
    <div class="item"><div class="label">Course</div><div class="value">${escapeHtml(round.courseName)}</div></div>
    <div class="item"><div class="label">Session 1</div><div class="value">${escapeHtml(round.session1Date)}</div></div>
    <div class="item"><div class="label">Countdown</div><div class="value">${escapeHtml(countdownLabel(round.session1Date))}</div></div>
    <div class="item"><div class="label">Open issues</div><div class="value">${round.issues.filter(i => i.status === 'open').length}</div></div>
  `;
  wrap.appendChild(meta);

  const grid = document.createElement('div');
  grid.className = 'cohort-grid';

  round.cohorts.forEach((cohort, idx) => {
    const prog = cohortProgress(cohort);
    const started = prog.checked > 0;
    const status = statusFor(prog.pct, started);
    const cohortIssues = round.issues.filter(i => i.cohortIdx === idx).length;

    const card = document.createElement('button');
    card.className = 'cohort-card';
    card.setAttribute('aria-label', 'Open ' + cohort.label);
    card.innerHTML = `
      <div class="cohort-card-head">
        <div class="cohort-card-title">${escapeHtml(cohort.label)}</div>
        <span class="status-badge ${status.cls}">${status.label}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${prog.pct}%;background:${progressColor(prog.pct, started)}"></div></div>
      <div class="cohort-card-foot">
        <span>${prog.checked} of ${prog.total} items</span>
        <span>${cohortIssues} ${cohortIssues === 1 ? 'issue' : 'issues'}</span>
      </div>
    `;
    card.addEventListener('click', () => { store.activeCohort = idx; store.view = 'cohort'; saveStore(); render(); });
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

// ----------------------------- COHORT -----------------------------

function renderCohort() {
  const round = activeRound();
  const idx = store.activeCohort;
  const cohort = round.cohorts[idx];
  if (!cohort) {
    const div = document.createElement('div');
    div.className = 'empty';
    div.textContent = 'Cohort not found.';
    return div;
  }
  const wrap = document.createElement('div');

  const crumb = document.createElement('div');
  crumb.className = 'breadcrumb';
  crumb.innerHTML = `<button id="back-summary">Round summary</button> / ${escapeHtml(cohort.label)}`;
  crumb.querySelector('#back-summary').addEventListener('click', () => { store.view = 'summary'; render(); });
  wrap.appendChild(crumb);

  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  const prog = cohortProgress(cohort);
  const status = statusFor(prog.pct, prog.checked > 0);
  toolbar.innerHTML = `
    <div>
      <h2 style="margin:0 0 4px;font-size:20px;">${escapeHtml(cohort.label)}</h2>
      <div style="color:var(--text-muted);font-size:13px;">${prog.checked} of ${prog.total} items complete</div>
    </div>
    <span class="status-badge ${status.cls}">${status.label}</span>
  `;
  wrap.appendChild(toolbar);

  SECTIONS.forEach((section, sectionIdx) => {
    wrap.appendChild(renderSection(cohort, section, sectionIdx, idx));
  });

  wrap.appendChild(renderEdgeCases(cohort, idx));

  const navWrap = document.createElement('div');
  navWrap.style.display = 'flex';
  navWrap.style.justifyContent = 'space-between';
  navWrap.style.marginTop = '24px';
  navWrap.style.gap = '8px';

  const prevBtn = document.createElement('button');
  prevBtn.className = 'btn';
  prevBtn.textContent = '← Previous cohort';
  prevBtn.disabled = idx === 0;
  if (idx === 0) prevBtn.style.visibility = 'hidden';
  prevBtn.addEventListener('click', () => { store.activeCohort = Math.max(0, idx - 1); saveStore(); render(); window.scrollTo(0, 0); });
  navWrap.appendChild(prevBtn);

  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn';
  nextBtn.textContent = 'Next cohort →';
  nextBtn.disabled = idx === round.cohorts.length - 1;
  if (idx === round.cohorts.length - 1) nextBtn.style.visibility = 'hidden';
  nextBtn.addEventListener('click', () => { store.activeCohort = Math.min(round.cohorts.length - 1, idx + 1); saveStore(); render(); window.scrollTo(0, 0); });
  navWrap.appendChild(nextBtn);

  wrap.appendChild(navWrap);
  return wrap;
}

function renderSection(cohort, section, sectionIdx, cohortIdx) {
  const sectionKey = `${cohortIdx}-${section.id}`;
  const collapsed = store.collapsedSections[sectionKey];
  const wrap = document.createElement('div');
  wrap.className = 'section' + (collapsed ? ' collapsed' : '');

  const head = document.createElement('button');
  head.className = 'section-head';
  head.setAttribute('aria-expanded', String(!collapsed));
  const prog = sectionProgress(cohort, section);
  head.innerHTML = `
    <div class="section-title">${sectionIdx + 1}. ${escapeHtml(section.title)}</div>
    <div class="section-meta">
      <span>${prog.checked} / ${prog.total}</span>
      <span class="chevron" aria-hidden="true"></span>
    </div>
  `;
  head.addEventListener('click', () => {
    store.collapsedSections[sectionKey] = !collapsed;
    render();
  });
  wrap.appendChild(head);

  const body = document.createElement('div');
  body.className = 'section-body';
  section.items.forEach(item => body.appendChild(renderItem(cohort, section, item, cohortIdx, sectionIdx)));
  wrap.appendChild(body);
  return wrap;
}

function renderItem(cohort, section, item, cohortIdx, sectionIdx) {
  const checked = !!cohort.state.checks[item.id];
  const note = cohort.state.notes[item.id] || '';
  const noteKey = `${cohortIdx}-${item.id}`;
  const noteOpen = !!store.expandedNotes[noteKey];

  const row = document.createElement('div');
  row.className = 'item';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = checked;
  cb.id = 'cb-' + cohortIdx + '-' + item.id;
  cb.setAttribute('aria-labelledby', 'lbl-' + cohortIdx + '-' + item.id);
  cb.addEventListener('change', () => {
    cohort.state.checks[item.id] = cb.checked;
    saveStore();
    render();
  });
  cb.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      store.expandedNotes[noteKey] = !noteOpen;
      render();
    }
  });
  row.appendChild(cb);

  const label = document.createElement('label');
  label.className = 'item-label' + (checked ? ' checked' : '');
  label.id = 'lbl-' + cohortIdx + '-' + item.id;
  label.htmlFor = cb.id;
  label.textContent = item.text;
  row.appendChild(label);

  const actions = document.createElement('div');
  actions.className = 'item-actions';

  const noteBtn = document.createElement('button');
  noteBtn.className = 'btn btn-small' + (note ? ' has-note' : '');
  noteBtn.textContent = note ? 'Edit note' : 'Add note';
  noteBtn.setAttribute('aria-label', (note ? 'Edit note for: ' : 'Add note for: ') + item.text);
  noteBtn.addEventListener('click', () => {
    store.expandedNotes[noteKey] = !noteOpen;
    render();
  });
  actions.appendChild(noteBtn);

  const issueBtn = document.createElement('button');
  issueBtn.className = 'btn btn-small';
  issueBtn.textContent = 'Log issue';
  issueBtn.setAttribute('aria-label', 'Log issue for: ' + item.text);
  issueBtn.addEventListener('click', () => openIssueModal({ cohortIdx: cohortIdx, sectionIdx: sectionIdx }));
  actions.appendChild(issueBtn);

  row.appendChild(actions);

  if (noteOpen || note) {
    const noteWrap = document.createElement('div');
    noteWrap.className = 'item-note';
    const ta = document.createElement('textarea');
    ta.value = note;
    ta.placeholder = 'Add a note for this item';
    ta.setAttribute('aria-label', 'Note for: ' + item.text);
    ta.addEventListener('input', () => {
      cohort.state.notes[item.id] = ta.value;
      saveStore();
    });
    ta.addEventListener('blur', () => {
      if (!ta.value.trim()) {
        delete cohort.state.notes[item.id];
        delete store.expandedNotes[noteKey];
        saveStore();
        render();
      }
    });
    noteWrap.appendChild(ta);
    row.appendChild(noteWrap);
  }

  return row;
}

function renderEdgeCases(cohort, cohortIdx) {
  const wrap = document.createElement('div');
  wrap.className = 'edge-section';
  const heading = document.createElement('h3');
  heading.textContent = 'Before you close out, consider';
  wrap.appendChild(heading);
  const desc = document.createElement('p');
  desc.textContent = 'Edge cases that may apply to this cohort. Mark each as checked or not applicable.';
  wrap.appendChild(desc);

  EDGE_CASES.forEach(ec => {
    const state = cohort.state.edgeCases[ec.id] || null;
    const row = document.createElement('div');
    row.className = 'edge-item';

    const text = document.createElement('div');
    text.textContent = ec.text;
    row.appendChild(text);

    const toggle = document.createElement('div');
    toggle.className = 'edge-toggle';
    toggle.setAttribute('role', 'group');
    toggle.setAttribute('aria-label', 'Status for: ' + ec.text);

    const checkedBtn = document.createElement('button');
    checkedBtn.textContent = 'Checked';
    checkedBtn.className = state === 'checked' ? 'active' : '';
    checkedBtn.addEventListener('click', () => {
      cohort.state.edgeCases[ec.id] = state === 'checked' ? null : 'checked';
      saveStore();
      render();
    });

    const naBtn = document.createElement('button');
    naBtn.textContent = 'Not applicable';
    naBtn.className = state === 'na' ? 'active na' : '';
    naBtn.addEventListener('click', () => {
      cohort.state.edgeCases[ec.id] = state === 'na' ? null : 'na';
      saveStore();
      render();
    });

    toggle.appendChild(checkedBtn);
    toggle.appendChild(naBtn);
    row.appendChild(toggle);
    wrap.appendChild(row);
  });

  return wrap;
}

// ----------------------------- ISSUES -----------------------------

function renderIssues() {
  const round = activeRound();
  const wrap = document.createElement('div');

  const toolbar = document.createElement('div');
  toolbar.className = 'toolbar';
  toolbar.innerHTML = `<h2 style="margin:0;font-size:20px;">Issue log</h2>`;
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-primary';
  addBtn.textContent = 'New issue';
  addBtn.addEventListener('click', () => openIssueModal({}));
  toolbar.appendChild(addBtn);
  wrap.appendChild(toolbar);

  if (round.issues.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<p>No issues logged for this round yet.</p><p style="font-size:13px;">Use the <strong>Log issue</strong> button on any checklist item, or click <strong>New issue</strong> above.</p>';
    wrap.appendChild(empty);
    return wrap;
  }

  const list = document.createElement('div');
  list.className = 'issues-list';
  const ordered = round.issues.slice().sort((a, b) => {
    if (a.status !== b.status) return a.status === 'open' ? -1 : 1;
    return b.dateLogged.localeCompare(a.dateLogged);
  });
  ordered.forEach(issue => list.appendChild(renderIssueRow(issue, round)));
  wrap.appendChild(list);
  return wrap;
}

function renderIssueRow(issue, round) {
  const row = document.createElement('div');
  row.className = 'issue-row';
  const cohortLabel = round.cohorts[issue.cohortIdx] ? round.cohorts[issue.cohortIdx].label : 'Unknown cohort';
  const sectionLabel = SECTIONS[issue.sectionIdx] ? SECTIONS[issue.sectionIdx].title : 'General';
  const left = document.createElement('div');
  left.innerHTML = `
    <div class="issue-meta">${escapeHtml(cohortLabel)} · ${escapeHtml(sectionLabel)} · ${escapeHtml(issue.dateLogged.slice(0, 10))}</div>
    <div class="issue-desc">${escapeHtml(issue.description)}</div>
    ${issue.resolution ? `<div class="issue-resolution"><strong>Resolution:</strong> ${escapeHtml(issue.resolution)}</div>` : ''}
  `;
  row.appendChild(left);
  const right = document.createElement('div');
  right.style.display = 'flex';
  right.style.flexDirection = 'column';
  right.style.gap = '6px';
  right.style.alignItems = 'flex-end';

  const statusBadge = document.createElement('span');
  statusBadge.className = 'status-badge ' + (issue.status === 'open' ? 'status-amber' : 'status-green');
  statusBadge.textContent = issue.status === 'open' ? 'Open' : 'Resolved';
  right.appendChild(statusBadge);

  const editBtn = document.createElement('button');
  editBtn.className = 'btn btn-small';
  editBtn.textContent = 'Edit';
  editBtn.addEventListener('click', () => openIssueModal({ editingId: issue.id }));

function exportMarkdown() {
  const round = activeRound();
  if (!round) return;
  const lines = [];
  lines.push('# Pre-Round Launch Checklist');
  lines.push('');
  lines.push('- Round: ' + round.roundNumber);
  lines.push('- Course: ' + round.courseName);
  lines.push('- First session: ' + round.session1Date);
  lines.push('- Exported: ' + new Date().toISOString().slice(0, 10));
  lines.push('');

  round.cohorts.forEach((cohort, idx) => {
    const prog = cohortProgress(cohort);
    const status = statusFor(prog.pct, prog.checked > 0);
    lines.push('## ' + cohort.label);
    lines.push('');
    lines.push('Status: ' + status.label + ' (' + prog.checked + ' of ' + prog.total + ' items, ' + prog.pct + '%)');
    lines.push('');
    SECTIONS.forEach((section, si) => {
      const sp = sectionProgress(cohort, section);
      lines.push('### ' + (si + 1) + '. ' + section.title + ' (' + sp.checked + '/' + sp.total + ')');
      lines.push('');
      section.items.forEach(item => {
        const checked = cohort.state.checks[item.id] ? 'x' : ' ';
        lines.push('- [' + checked + '] ' + item.text);
        const note = cohort.state.notes[item.id];
        if (note) lines.push('  - Note: ' + note);
      });
      lines.push('');
    });
    lines.push('### Edge cases');
    lines.push('');
    EDGE_CASES.forEach(ec => {
      const st = cohort.state.edgeCases[ec.id];
      const stLabel = st === 'checked' ? 'Checked' : st === 'na' ? 'Not applicable' : 'Not addressed';
      lines.push('- [' + (st ? 'x' : ' ') + '] ' + ec.text + ' (' + stLabel + ')');
    });
    lines.push('');
  });

  lines.push('## Issue log');
  lines.push('');
  if (round.issues.length === 0) {
    lines.push('No issues logged.');
    lines.push('');
  } else {
    round.issues.forEach(issue => {
      const cohortLabel = round.cohorts[issue.cohortIdx] ? round.cohorts[issue.cohortIdx].label : 'Unknown';
      const sectionLabel = SECTIONS[issue.sectionIdx] ? SECTIONS[issue.sectionIdx].title : 'General';
      lines.push('### ' + cohortLabel + ' / ' + sectionLabel + ' (' + issue.status + ')');
      lines.push('- Logged: ' + issue.dateLogged.slice(0, 10));
      lines.push('- Description: ' + issue.description);
      if (issue.resolution) lines.push('- Resolution: ' + issue.resolution);
      lines.push('');
    });
  }

  lines.push('## Failure response reference');
  lines.push('');
  lines.push('| Issue | Action | Escalate to | Timeline |');
  lines.push('|---|---|---|---|');
  FAILURE_TABLE.forEach(r => {
    lines.push('| ' + r.issue + ' | ' + r.action + ' | ' + r.escalate + ' | ' + r.timeline + ' |');
  });

  const md = lines.join('\n');
  const courseSlug = (round.courseName || 'course').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const today = new Date().toISOString().slice(0, 10);
  const filename = courseSlug + '-round-' + round.roundNumber + '-launch-checklist-' + today + '.md';

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ----- State helpers -----

function activeMidroundRound() {
  if (!store.activeMidroundRound) return null;
  return store.midroundRounds[store.activeMidroundRound] || null;
}

function newMidroundCohort(label, facilitator) {
  return { label: label, facilitator: facilitator || '', weeks: {} };
}

function newWeekData() {
  return { values: {}, actions: {}, completedAt: null };
}

function getOrCreateWeekData(cohort, week) {
  const key = String(week);
  if (!cohort.weeks[key]) cohort.weeks[key] = newWeekData();
  return cohort.weeks[key];
}

function currentWeekFor(round) {
  if (!round || !round.session1Date) return 1;
  const start = new Date(round.session1Date + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const diffDays = Math.floor((now - start) / (1000 * 60 * 60 * 24));
  const week = Math.floor(diffDays / 7) + 1;
  return Math.max(1, Math.min(round.weeks || 5, week));
}

function createMidroundRound(setup) {
  const cohorts = setup.cohortLabels.slice(0, setup.numCohorts).map((lab, i) =>
    newMidroundCohort(lab || ('Cohort ' + (i + 1)), setup.facilitators[i] || '')
  );
  const round = {
    roundNumber: setup.roundNumber,
    courseName: setup.courseName,
    session1Date: setup.session1Date,
    weeks: setup.weeks,
    cohorts: cohorts,
    createdAt: new Date().toISOString(),
    closed: false
  };
  store.midroundRounds[String(setup.roundNumber)] = round;
  store.activeMidroundRound = String(setup.roundNumber);
  store.activeMidroundCohort = 0;
  store.activeWeek = currentWeekFor(round);
  store.midroundView = 'summary';
  saveStore();
}

function updateMidroundSetup(setup) {
  const round = activeMidroundRound();
  if (!round) return;
  round.roundNumber = setup.roundNumber;
  round.courseName = setup.courseName;
  round.session1Date = setup.session1Date;
  round.weeks = setup.weeks;
  const oldCount = round.cohorts.length;
  if (setup.numCohorts > oldCount) {
    for (let i = oldCount; i < setup.numCohorts; i++) {
      round.cohorts.push(newMidroundCohort(setup.cohortLabels[i] || ('Cohort ' + (i + 1)), setup.facilitators[i] || ''));
    }
  } else if (setup.numCohorts < oldCount) {
    round.cohorts = round.cohorts.slice(0, setup.numCohorts);
  }
  for (let i = 0; i < setup.numCohorts; i++) {
    if (setup.cohortLabels[i]) round.cohorts[i].label = setup.cohortLabels[i];
    if (setup.facilitators[i] != null) round.cohorts[i].facilitator = setup.facilitators[i];
  }
  const newKey = String(setup.roundNumber);
  if (newKey !== store.activeMidroundRound) {
    delete store.midroundRounds[store.activeMidroundRound];
    store.midroundRounds[newKey] = round;
    store.activeMidroundRound = newKey;
  }
  saveStore();
}

// ----- Computed -----

function cohortLatestWeekData(cohort, currentWeek) {
  for (let w = currentWeek; w >= 1; w--) {
    if (cohort.weeks[String(w)]) return { week: w, data: cohort.weeks[String(w)] };
  }
  return null;
}

function weekCompletionRatio(weekData) {
  if (!weekData) return 0;
  let done = 0;
  let total = 0;
  MIDROUND_SECTIONS.forEach(s => {
    s.items.forEach(item => {
      total++;
      const v = weekData.values[item.id];
      const hasValue = item.type === 'text'
        ? (typeof v === 'string' && v.trim().length > 0)
        : (v != null && v !== '' && v !== false);
      if (hasValue) done++;
    });
  });
  return total ? done / total : 0;
}

function cohortMidroundStatus(cohort, currentWeek) {
  const latest = cohortLatestWeekData(cohort, currentWeek);
  if (!latest) return { cls: 'status-grey', label: 'Not started', pulse: null };
  const v = latest.data.values;
  const pulse = typeof v.mds1i2 === 'number' ? v.mds1i2 : null;
  const flags = openActionsForWeek(latest.data).length;
  const facilitatorConcern = v.mds3i2 === 'no' || v.mds3i4 === 'no';
  // Critical signals fire regardless of how much else is filled in
  if (pulse != null && pulse < 6) return { cls: 'status-red', label: 'Needs action', pulse: pulse };
  if (flags >= 3) return { cls: 'status-red', label: 'Needs action', pulse: pulse };
  if (facilitatorConcern) return { cls: 'status-red', label: 'Needs action', pulse: pulse };
  // Sparse data with no critical signal means "not started"
  if (latest.week < currentWeek || weekCompletionRatio(latest.data) < 0.4) {
    return { cls: 'status-grey', label: 'Not started', pulse: pulse };
  }
  if (pulse != null && pulse < 8) return { cls: 'status-amber', label: 'Watch', pulse: pulse };
  if (flags >= 1) return { cls: 'status-amber', label: 'Watch', pulse: pulse };
  if (pulse != null && pulse >= 8) return { cls: 'status-green', label: 'Healthy', pulse: pulse };
  return { cls: 'status-amber', label: 'Watch', pulse: pulse };
}

function openActionsForWeek(weekData) {
  const out = [];
  if (!weekData) return out;
  MIDROUND_SECTIONS.forEach(s => {
    s.items.forEach(item => {
      if (!item.triggersAction) return;
      if (item.triggersAction(weekData.values)) {
        const actionText = weekData.actions[item.id] || '';
        if (!actionText.trim()) out.push({ sectionId: s.id, itemId: item.id, label: item.text });
      }
    });
  });
  return out;
}

function pulseTrend(cohort, currentWeek) {
  const vals = [];
  for (let w = 1; w <= currentWeek; w++) {
    const d = cohort.weeks[String(w)];
    if (d && typeof d.values.mds1i2 === 'number') vals.push({ week: w, value: d.values.mds1i2 });
  }
  if (vals.length < 2) return 'insufficient';
  const last = vals[vals.length - 1].value;
  const prev = vals[vals.length - 2].value;
  if (last > prev + 0.3) return 'improving';
  if (last < prev - 0.3) return 'declining';
  return 'steady';
}

function trendArrow(t) {
  if (t === 'improving') return '↑';
  if (t === 'declining') return '↓';
  if (t === 'steady') return '→';
  return '';
}

function allOpenActionsForRound(round) {
  if (!round) return [];
  const out = [];
  round.cohorts.forEach((cohort, ci) => {
    Object.keys(cohort.weeks).forEach(weekKey => {
      const w = cohort.weeks[weekKey];
      if (!w.actionStatus) w.actionStatus = {};
      MIDROUND_SECTIONS.forEach(s => {
        s.items.forEach(item => {
          if (!item.triggersAction) return;
          if (!item.triggersAction(w.values)) return;
          const actionText = (w.actions[item.id] || '').trim();
          const status = w.actionStatus[item.id] || (actionText ? 'resolved' : 'open');
          if (status === 'resolved') return;
          out.push({
            cohortIdx: ci,
            cohortLabel: cohort.label,
            week: Number(weekKey),
            sectionId: s.id,
            sectionTitle: s.title,
            itemId: item.id,
            itemLabel: item.text,
            status: status
          });
        });
      });
    });
  });
  return out;
}

  card.appendChild(formRow('Course name', `<input type="text" id="md-setup-course" value="${escapeHtml(initial.courseName)}" list="bluedot-courses" placeholder="Pick a BlueDot course or type your own" required>`));
  card.appendChild(formRow('First session date', `<input type="date" id="md-setup-date" value="${escapeHtml(initial.session1Date)}" required>`));
  card.appendChild(formRow('Round length (weeks)', `<input type="number" id="md-setup-weeks" min="3" max="12" value="${initial.weeks || 5}" required>`));
  card.appendChild(formRow('Number of cohorts', `<input type="number" id="md-setup-num" min="1" max="12" value="${initNum}" required>`));

  const labelsWrap = document.createElement('div');
  labelsWrap.className = 'form-row';
  const labelsLabel = document.createElement('label');
  labelsLabel.textContent = 'Cohort labels and facilitators';
  const labelsHint = document.createElement('div');
  labelsHint.className = 'hint';
  labelsHint.textContent = 'One row per cohort. Facilitator name is free text.';
  const labelsList = document.createElement('div');
  labelsList.id = 'md-setup-rows';
  labelsList.style.display = 'grid';
  labelsList.style.gap = '6px';
  labelsList.style.marginTop = '6px';
  labelsWrap.appendChild(labelsLabel);
  labelsWrap.appendChild(labelsList);
  labelsWrap.appendChild(labelsHint);
  card.appendChild(labelsWrap);

  function renderMdLabelRows(container, labels, facs) {
    container.innerHTML = '';
    labels.forEach((lab, i) => {
      const row = document.createElement('div');
      row.style.display = 'grid';
      row.style.gridTemplateColumns = '1fr 1fr';
      row.style.gap = '6px';
      const labIn = document.createElement('input');
      labIn.type = 'text';
      labIn.value = lab;
      labIn.placeholder = 'Cohort label';
      labIn.setAttribute('aria-label', 'Label for cohort ' + (i + 1));
      labIn.className = 'md-row-label';
      const facIn = document.createElement('input');
      facIn.type = 'text';
      facIn.value = facs[i] || '';
      facIn.placeholder = 'Facilitator name';
      facIn.setAttribute('aria-label', 'Facilitator for cohort ' + (i + 1));
      facIn.className = 'md-row-fac';
      row.appendChild(labIn);
      row.appendChild(facIn);
      container.appendChild(row);
    });
  }

  renderMdLabelRows(labelsList, initLabels, initFacilitators);

  card.querySelector('#md-setup-num').addEventListener('input', e => {
    const n = Math.max(1, Math.min(12, Number(e.target.value) || 1));
    const curLabels = Array.from(labelsList.querySelectorAll('.md-row-label')).map(i => i.value);
    const curFacs = Array.from(labelsList.querySelectorAll('.md-row-fac')).map(i => i.value);
    const nextLabels = Array.from({ length: n }, (_, i) => curLabels[i] || ('Cohort ' + (i + 1)));
    const nextFacs = Array.from({ length: n }, (_, i) => curFacs[i] || '');
    renderMdLabelRows(labelsList, nextLabels, nextFacs);
  });

  const actions = document.createElement('div');
  actions.style.display = 'flex';
  actions.style.gap = '8px';
  actions.style.marginTop = '20px';

  const submitBtn = document.createElement('button');
  submitBtn.className = 'btn btn-primary';
  submitBtn.textContent = existing ? 'Save changes' : 'Start tracking';
  submitBtn.addEventListener('click', () => {
    const setup = {
      roundNumber: Number(card.querySelector('#md-setup-round').value),
      courseName: card.querySelector('#md-setup-course').value.trim() || 'Technical AI Safety Course',
      session1Date: card.querySelector('#md-setup-date').value,
      weeks: Math.max(3, Math.min(12, Number(card.querySelector('#md-setup-weeks').value) || 5)),
      numCohorts: Math.max(1, Math.min(12, Number(card.querySelector('#md-setup-num').value) || 1)),
      cohortLabels: Array.from(labelsList.querySelectorAll('.md-row-label')).map(i => i.value.trim()),
      facilitators: Array.from(labelsList.querySelectorAll('.md-row-fac')).map(i => i.value.trim())
    };
    if (!setup.roundNumber || !setup.session1Date) {
      alert('Round number and first session date are required.');
      return;
    }
    if (existing) {
      const newKey = String(setup.roundNumber);
      if (newKey !== store.activeMidroundRound && store.midroundRounds[newKey]) {
        alert('Round ' + setup.roundNumber + ' already exists in mid-round. Pick a different number.');
        return;
      }
      updateMidroundSetup(setup);
    } else {
      createMidroundRound(setup);
    }
    store.midroundView = 'summary';
    saveStore();
    render();
  });
  actions.appendChild(submitBtn);

  if (existing) {
    const cancel = document.createElement('button');
    cancel.className = 'btn';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', () => { store.midroundView = 'summary'; render(); });
    actions.appendChild(cancel);
  }

  card.appendChild(actions);
  wrap.appendChild(card);
  return wrap;
}

function latestCheckDateFor(round) {
  let latest = null;
  round.cohorts.forEach(c => {
    Object.values(c.weeks).forEach(w => {
      if (w.completedAt) {
        if (!latest || w.completedAt > latest) latest = w.completedAt;
      }
    });
  });
  return latest ? latest.slice(0, 10) : null;
}

function renderMidroundCohort() {
  const round = activeMidroundRound();

    const div = document.createElement('div'); div.className = 'empty'; div.textContent = 'Cohort not found.'; return div;
  }

  const wrap = document.createElement('div');

  crumb.innerHTML = `<button id="back-md-summary">Round summary</button> / ${escapeHtml(cohort.label)}`;
  crumb.querySelector('#back-md-summary').addEventListener('click', () => { store.midroundView = 'summary'; render(); });
  wrap.appendChild(crumb);

  const head = document.createElement('div');
  head.className = 'toolbar';
  const status = cohortMidroundStatus(cohort, currentWeek);
  head.innerHTML = `
    <div>
      <h2 style="margin:0 0 4px;font-size:20px;">${escapeHtml(cohort.label)}</h2>
      <div style="color:var(--text-muted);font-size:13px;">${cohort.facilitator ? 'Facilitator: ' + escapeHtml(cohort.facilitator) : 'No facilitator set'}</div>

    t.className = 'week-tab' + (store.activeWeek === w ? ' active' : '');
    const wd = cohort.weeks[String(w)];
    const ratio = weekCompletionRatio(wd);
    let dotColor = 'var(--text-subtle)';
    if (wd) {
      if (ratio >= 0.8) dotColor = 'var(--green-fg)';
      else if (ratio >= 0.4) dotColor = 'var(--amber-fg)';
      else dotColor = 'var(--red-fg)';
    }
    t.innerHTML = 'Week ' + w + '<span class="week-status" style="background:' + dotColor + '"></span>';

    t.addEventListener('click', () => { store.activeWeek = w; saveStore(); render(); });
    weekBar.appendChild(t);
  }

    const future = document.createElement('div');
    future.className = 'empty';
    future.textContent = 'This week has not started yet based on the round\'s session 1 date. Entries are still allowed if you need to backfill.';

  note.style.color = 'var(--text-muted)';

function renderMidroundSection(section, weekData, cohort, week, sectionIdx) {
  const wrap = document.createElement('div');
  wrap.className = 'section';
  const head = document.createElement('div');
  head.className = 'section-head';
  head.style.cursor = 'default';
  const filled = section.items.filter(it => {
    const v = weekData.values[it.id];
    return it.type === 'text' ? (typeof v === 'string' && v.trim().length > 0) : (v != null && v !== '' && v !== false);
  }).length;
  head.innerHTML = `<div class="section-title">${sectionIdx + 1}. ${escapeHtml(section.title)}</div><div class="section-meta"><span>${filled} / ${section.items.length}</span></div>`;
  wrap.appendChild(head);
  const body = document.createElement('div');
  body.className = 'section-body';
  section.items.forEach(item => {
    body.appendChild(renderMidroundItem(item, weekData, cohort, week, section));
  });
  wrap.appendChild(body);
  return wrap;
}

function renderMidroundItem(item, weekData, cohort, week, section) {
  const row = document.createElement('div');
  row.className = 'md-item';
  const label = document.createElement('div');
  label.className = 'md-item-label';
  label.textContent = item.text;
  row.appendChild(label);

  const value = weekData.values[item.id];

  if (item.type === 'check') {
    const wrapper = document.createElement('div');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!value;
    cb.id = 'md-cb-' + cohort.label + '-w' + week + '-' + item.id;
    cb.style.width = '18px';
    cb.style.height = '18px';
    cb.style.cursor = 'pointer';
    cb.addEventListener('change', () => {
      weekData.values[item.id] = cb.checked;
      saveStore();
      render();
    });
    const lab = document.createElement('label');
    lab.htmlFor = cb.id;
    lab.textContent = ' Confirm';
    lab.style.marginLeft = '6px';
    lab.style.cursor = 'pointer';
    wrapper.appendChild(cb);
    wrapper.appendChild(lab);
    row.appendChild(wrapper);
  } else if (item.type === 'number') {
    const input = document.createElement('input');
    input.type = 'number';
    input.value = value == null ? '' : value;
    if (item.min != null) input.min = item.min;
    if (item.max != null) input.max = item.max;
    input.setAttribute('aria-label', item.text);
    input.addEventListener('input', () => {
      const n = input.value === '' ? null : Number(input.value);
      weekData.values[item.id] = n;
      saveStore();
    });
    input.addEventListener('blur', () => render());
    row.appendChild(input);
  } else if (item.type === 'text') {
    const ta = document.createElement('textarea');
    ta.value = value || '';
    ta.placeholder = 'Notes';
    ta.setAttribute('aria-label', item.text);
    ta.addEventListener('input', () => {
      weekData.values[item.id] = ta.value;
      saveStore();
    });
    ta.addEventListener('blur', () => render());
    row.appendChild(ta);
  } else if (item.type === 'choice') {
    const group = document.createElement('div');
    group.className = 'md-radio-group';
    group.setAttribute('role', 'radiogroup');
    group.setAttribute('aria-label', item.text);
    item.options.forEach(opt => {
      const b = document.createElement('button');
      b.textContent = opt;
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', value === opt ? 'true' : 'false');
      b.className = value === opt ? 'active' : '';
      b.addEventListener('click', () => {
        weekData.values[item.id] = (value === opt) ? null : opt;
        saveStore();
        render();
      });
      group.appendChild(b);
    });
    row.appendChild(group);
  }

  // Action-required panel
  if (item.triggersAction) {
    const needs = item.triggersAction(weekData.values);
    if (needs) {
      const actionText = weekData.actions[item.id] || '';
      const ar = document.createElement('div');
      ar.className = 'md-action-required' + (actionText.trim() ? ' resolved' : '');
      ar.innerHTML = '<strong>' + (actionText.trim() ? 'Action logged' : 'Action required') + '.</strong> ' + (actionText.trim() ? '' : 'Log the action you have taken or will take.');
      const ta = document.createElement('textarea');
      ta.value = actionText;
      ta.placeholder = 'Action taken';
      ta.setAttribute('aria-label', 'Action for: ' + item.text);
      ta.addEventListener('input', () => {
        weekData.actions[item.id] = ta.value;
        saveStore();
      });
      ta.addEventListener('blur', () => render());
      ar.appendChild(ta);
      row.appendChild(ar);
    }
  }
  return row;
}

    // Flags log

      empty.textContent = 'No flags raised.';
      flags.appendChild(empty);
    } else {
      flagList.forEach(f => {
        const row = document.createElement('div');
        row.style.padding = '6px 0';
        row.style.borderTop = '1px solid var(--border)';

        const sCls = f.resolved ? 'status-green' : 'status-amber';
        row.innerHTML = `<div><span class="status-badge ${sCls}">${status}</span> <strong>Week ${f.week}:</strong> ${escapeHtml(f.itemLabel)}</div>${f.action ? '<div style="color:var(--text-muted);margin-top:2px;">' + escapeHtml(f.action) + '</div>' : ''}`;
